<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-VOICE | FINAL MASTER</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .studio-box { border: 3px solid #ff0000; padding: 40px; border-radius: 30px; display: inline-block; background: #050505; box-shadow: 0 0 30px #ff0000; }
        #micBtn { width: 100px; height: 100px; border-radius: 50%; border: none; background: #ff0000; color: white; font-size: 40px; cursor: pointer; transition: 0.3s; }
        .pulse { animation: pulse-red 1s infinite; background: #00ff00 !important; box-shadow: 0 0 20px #00ff00; }
        @keyframes pulse-red { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .info { margin-top: 20px; font-weight: bold; color: #ff0000; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="studio-box">
    <h1 style="margin-top:0;">X-VOICE <span style="color:#ff0000">PRO</span></h1>
    <p style="font-size:10px; color:#555;">SYSTEM: SECURE AUDIO BYPASS v6.0</p>
    
    <button id="micBtn" onclick="initStudio()">🎤</button>
    
    <div id="status" class="info">TAP MIC TO ENABLE SPEAKER</div>
    <p id="subStatus" style="font-size:10px; color:#444;">WAITING FOR OWNER: RANJAN</p>
</div>

<script>
    let audioCtx = null;
    let micStream = null;

    async function initStudio() {
        const btn = document.getElementById('micBtn');
        const status = document.getElementById('status');

        if (!audioCtx) {
            try {
                // 1. Force Browser to ask for MIC
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });

                // 2. Start Audio Engine
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(micStream);
                
                // 3. Connect MIC directly to SPEAKER
                source.connect(audioCtx.destination);

                // 4. UI Update
                btn.classList.add('pulse');
                btn.innerText = "🔊";
                status.innerText = "LIVE ON SPEAKER!";
                status.style.color = "#00ff00";
                
                // Voice confirmation
                window.speechSynthesis.speak(new SpeechSynthesisUtterance("Speaker active. Hello Ranjan."));

            } catch (err) {
                alert("Permission Error! Settings mein jaakar Mic ko ALLOW karo.");
                status.innerText = "PERMISSION DENIED";
                console.error(err);
            }
        } else {
            // STOP EVERYTHING
            location.reload(); 
        }
    }
</script>

</body>
</html>
