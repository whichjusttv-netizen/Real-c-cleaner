<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>Chronos Desktop Ultra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            width: 1280px; /* Fixed Desktop Width */
            background: #f1f3f4; 
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Via + Desktop Hybrid Header */
        .header-pro {
            background: #fff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-container {
            flex: 1;
            display: flex;
            background: #f1f3f4;
            border-radius: 30px;
            padding: 10px 25px;
            margin-right: 20px;
            border: 1px solid #dfe1e5;
        }

        input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 18px;
        }

        .go-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Loading Bar */
        #loader {
            position: fixed; top: 0; left: 0; height: 4px;
            background: #4285f4; width: 0%; transition: 0.4s;
        }

        /* Main Desktop Window */
        #displayArea {
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
            background: white;
        }
    </style>
</head>
<body>

<div id="loader"></div>

<div class="header-pro">
    <div class="search-container">
        <input type="text" id="urlInput" placeholder="Search Google or Enter URL (Desktop Force Mode)..." onkeydown="if(event.key==='Enter') loadDesktop()">
    </div>
    <button class="go-btn" onclick="loadDesktop()">SEARCH</button>
</div>

<iframe id="displayArea" src="https://www.google.com/search?q=Ranjan+AI&igu=1"></iframe>

<script>
    function loadDesktop() {
        let val = document.getElementById('urlInput').value;
        let frame = document.getElementById('displayArea');
        let loader = document.getElementById('loader');

        loader.style.width = "40%";

        // ALGORITHM: Force Desktop + Proxy Bypass
        let finalPath = "";

        if (val.includes('.') && !val.includes(' ')) {
            // Agar Spotify jaisi site block ho rahi hai, toh hum Proxy-Server ka use karenge
            // Ye server unka 'X-Frame-Options' block hata deta hai
            finalPath = "https://api.allorigins.win/raw?url=" + encodeURIComponent(val);
        } else {
            // Google Desktop Mode Force URL
            // &num=50 aur &tbm=isch (example) desktop features ko trigger karte hain
            finalPath = "https://www.google.com/search?q=" + encodeURIComponent(val) + "&igu=1&pws=0&gl=us&gws_rd=cr";
        }

        frame.src = finalPath;

        frame.onload = function() {
            loader.style.width = "100%";
            setTimeout(() => { loader.style.width = "0%"; }, 500);
        };
    }
</script>

</body>
</html>
