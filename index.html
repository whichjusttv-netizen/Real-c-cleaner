<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Ranjan Google Sync Browser</title>
    <style>
        body { width: 1280px; margin: 0; background: #fff; font-family: arial, sans-serif; }
        
        /* Aapka Via-style Search Bar */
        .top-nav {
            padding: 15px 40px;
            display: flex;
            background: white;
            border-bottom: 1px solid #ebebeb;
            position: sticky; top: 0; z-index: 999;
        }

        #appSearchBar {
            flex: 1;
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid #dfe1e5;
            font-size: 18px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,0.2);
        }

        .search-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            margin-left: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Iframe jo Desktop site dikhayega */
        #googleFrame {
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
        }

        #loading-line {
            height: 3px; background: #4285f4; width: 0%;
            position: fixed; top: 0; transition: 0.4s;
        }
    </style>
</head>
<body>

<div id="loading-line"></div>

<div class="top-nav">
    <input type="text" id="appSearchBar" placeholder="Google par search karein..." onkeydown="if(event.key==='Enter') syncSearch()">
    <button class="search-btn" onclick="syncSearch()">SEARCH</button>
</div>

<iframe id="googleFrame" src="https://www.google.com/search?igu=1"></iframe>

<script>
    function syncSearch() {
        let query = document.getElementById('appSearchBar').value;
        let frame = document.getElementById('googleFrame');
        let loader = document.getElementById('loading-line');

        if(query) {
            loader.style.width = "40%";
            
            // GOOGLE SYNC ALGORITHM:
            // Hum query ko encode karke Google ke desktop search URL mein bhej rahe hain
            // 'igu=1' frame mein kholne ke liye aur 'source=lnms' desktop results ke liye
            let googleURL = "https://www.google.com/search?q=" + encodeURIComponent(query) + "&igu=1&pws=0&adtest=on";
            
            frame.src = googleURL;

            frame.onload = function() {
                loader.style.width = "100%";
                setTimeout(() => { loader.style.width = "0%"; }, 500);
            };
        }
    }
</script>

</body>
</html>
