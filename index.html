<!DOCTYPE html>
<html>
<head>
    <title>X-VOICE PERMISSION FIX</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        .box { border: 2px solid #00ff00; padding: 20px; margin-top: 50px; border-radius: 20px; }
        #btn { background: #00ff00; color: #000; padding: 20px; border: none; border-radius: 50px; font-weight: bold; width: 80%; }
    </style>
</head>
<body>

<div class="box">
    <h2>X-VOICE MASTER</h2>
    <p id="msg">SYSTEM READY</p>
    <button id="btn" onclick="forcePermission()">ACTIVATE MIC POPUP</button>
</div>

<script>
    function forcePermission() {
        const msg = document.getElementById('msg');
        
        // Android WebView Mic Trigger
        navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
            msg.innerText = "POPUP ALLOWED! MIC WORKING";
            msg.style.color = "#00ff00";
            
            // Speaker Output Connection
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(audioContext.destination);
            
            alert("Bhai, Mic On ho gaya hai! Ab speaker check karo.");
        })
        .catch(function(err) {
            // Agar popup nahi aaya toh ye message dikhega
            msg.innerText = "STILL NO POPUP? Settings check karo.";
            alert("Permission Error: " + err.name);
        });
    }
</script>

</body>
</html>
