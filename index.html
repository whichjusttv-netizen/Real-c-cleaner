<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX CYBER-GOD v25</title>
    <style>
        :root { --neon: #00f2ff; --danger: #ff0055; --bg: #030308; --card: rgba(15, 15, 25, 0.9); --gold: #ffd700; --rgb: linear-gradient(90deg, #ff0055, #00f2ff, #00ff9d, #ff0055); }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; overflow: hidden; }
        
        /* 🌈 RGB EDGE LIGHTING */
        body::before { content: ""; position: fixed; inset: 0; border: 3px solid transparent; border-image: var(--rgb) 1; z-index: 10000; pointer-events: none; animation: rgb-flow 3s linear infinite; }
        @keyframes rgb-flow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        /* 🔒 DUAL-VAULT LOGIN */
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { background: #0a0a14; padding: 35px; border: 1px solid #1a1a2e; border-radius: 20px; width: 85%; text-align: center; box-shadow: 0 0 30px rgba(0,242,255,0.1); }

        #app { display: none; }
        
        /* 🔍 PRO SEARCH & UI */
        .header { position: sticky; top: 0; background: var(--bg); z-index: 100; border-bottom: 1px solid #1a1a2e; padding-bottom: 15px; }
        #search-bar { width: 92%; padding: 14px; background: #000; border: 1px solid var(--neon); color: var(--neon); border-radius: 12px; outline: none; margin: 10px 0; font-weight: bold; box-shadow: 0 0 10px rgba(0,242,255,0.2); }

        .wallet { background: #000; border: 1px solid var(--gold); padding: 12px; border-radius: 15px; margin-bottom: 15px; display: inline-block; width: 80%; }
        .balance { font-size: 32px; color: var(--gold); font-weight: bold; text-shadow: 0 0 15px rgba(255,215,0,0.3); }

        /* 🗄️ OPTIMIZED GHOST LIST */
        #main-list { height: 58vh; overflow-y: auto; scrollbar-width: none; padding-bottom: 120px; }
        #main-list::-webkit-scrollbar { display: none; }

        .card { 
            background: var(--card); border: 1px solid #1a1a2e; margin: 12px 0;
            padding: 18px; border-radius: 15px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; gap: 12px;
        }
        .card h3 { margin: 0; font-size: 14px; color: var(--neon); letter-spacing: 1px; text-transform: uppercase; }
        
        .server-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .srv-btn { background: #05050a; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .srv-btn:active { background: var(--neon); color: #000; border-color: var(--neon); }

        /* 💳 PKG FOOTER FIXED */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 20px; border-top: 1px solid #1a1a2e; display: flex; gap: 10px; z-index: 500; }
        .code-input { flex: 1; background: #0a0a0f; border: 1px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; outline: none; }
        .claim-btn { background: var(--gold); color: #000; border: none; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="box">
            <h2 style="color:var(--neon); margin:0; letter-spacing:2px;">RTX VAULT</h2>
            <p style="font-size:10px; color:#444; margin-bottom:20px;">v25.0 CYBER-GOD SYSTEM</p>
            <input type="password" id="pk" placeholder="ENTER ACCESS KEY" style="width:85%; padding:15px; background:#000; border:1px solid #222; color:var(--neon); border-radius:12px; text-align:center; font-size:18px;">
            <button onclick="unlock()" style="width:90%; padding:15px; background:var(--neon); color:#000; border:none; margin-top:20px; border-radius:12px; font-weight:bold; letter-spacing:1px;">AUTHORIZE</button>
        </div>
    </div>

    <div id="app">
        <div class="header">
            <input type="text" id="search-bar" placeholder="SEARCH 1000+ PREMIUM APPS..." onkeyup="filterApps()">
            <div class="wallet">
                <span style="font-size:10px; color:#555;">SECURITY CREDITS</span><br>
                <span class="balance" id="coin-txt">0000</span> <span style="color:var(--gold); font-size:12px;">CR</span>
            </div>
        </div>

        <div id="main-list"></div>

        <div class="footer">
            <input type="text" id="secret-inp" class="code-input" placeholder="ENTER CODE (pkg)">
            <button onclick="claimSecret()" class="claim-btn">CLAIM</button>
        </div>
    </div>

<script>
    let sc = parseInt(localStorage.getItem('user_sc')) || 0;
    let database = [];

    // 🏗️ DATABASE GEN v25
    function buildDatabase() {
        const apps = ["Gemini AI", "Netflix 4K", "Minecraft", "GTA VI", "ChatGPT-5", "Adobe Premiere", "Spotify Hi-Fi", "Canva Enterprise", "ExpressVPN", "PicsArt Pro"];
        const mirrors = ["rexdl.com", "apkmody.io", "happymod.com", "an1.com"];
        
        database = [];
        for(let i = 1; i <= 1000; i++) {
            let base = apps[i % apps.length];
            database.push({
                n: `${base} Premium #${i}`,
                s1: `https://www.google.com/search?q=site:${mirrors[i % mirrors.length]}+${encodeURIComponent(base)}+premium`,
                s2: `https://www.google.com/search?q=site:${mirrors[(i+1) % mirrors.length]}+${encodeURIComponent(base)}+premium`
            });
        }
    }

    function render(list) {
        const container = document.getElementById('main-list');
        let html = "";
        let limit = Math.min(list.length, 35); // Optimization for smooth scroll
        for(let i = 0; i < limit; i++) {
            html += `<div class="card">
                <h3>${list[i].n}</h3>
                <div class="server-grid">
                    <button class="srv-btn" onclick="openChrome('${list[i].s1}')">SERVER 1</button>
                    <button class="srv-btn" onclick="openChrome('${list[i].s2}')">SERVER 2</button>
                </div>
            </div>`;
        }
        container.innerHTML = html;
        container.scrollTop = 0;
    }

    function unlock() {
        const pass = document.getElementById('pk').value;
        if(pass === "RTX") {
            document.getElementById('gate').style.display='none';
            document.getElementById('app').style.display='block';
            buildDatabase();
            render(database);
            updateUI();
        } else if(pass === "1111") {
            // FAKE MODE
            window.location.href = "https://www.google.com/maps";
        } else { alert("ACCESS DENIED!"); }
    }

    // 💰 PKG SYSTEM FIXED (REAL-TIME UPDATE)
    function claimSecret() {
        let val = document.getElementById('secret-inp').value.trim().toLowerCase();
        if(val === "pkg") {
            sc += 1000;
            updateUI(); // Immediate screen update
            alert("1000 Credits Injected Successfully!");
            document.getElementById('secret-inp').value = "";
        } else { alert("INVALID CODE"); }
    }

    function filterApps() {
        let q = document.getElementById('search-bar').value.toLowerCase();
        let filtered = database.filter(a => a.n.toLowerCase().includes(q));
        render(filtered);
    }

    function openChrome(url) {
        if(sc >= 500) {
            sc -= 500;
            updateUI();
            window.open(url, '_blank');
        } else { alert("Low Credits! Use code 'pkg'"); }
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = sc.toString().padStart(4,'0');
        localStorage.setItem('user_sc', sc);
    }
</script>
</body>
</html>
