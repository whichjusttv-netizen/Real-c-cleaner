<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX BHARAT v54.0</title>
    <style>
        :root { --saffron: #FF9933; --white: #FFFFFF; --green: #138808; --bg: #050505; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; height: 100vh; overflow: hidden; }

        /* MAIN UI */
        #main-app { padding: 15px; display: flex; flex-direction: column; height: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--saffron); padding-bottom: 10px; margin-bottom: 15px; }
        #app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow-y: auto; padding-bottom: 80px; }
        .app-card { background: #111; border: 1px solid #222; border-radius: 15px; padding: 12px; text-align: center; }
        .btn-get { background: var(--saffron); border: none; padding: 8px; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; }

        /* ⚪ OFFICIAL REDIRECT PAGE (WHITE SCREEN) */
        #redirect-page { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; color: black; display: none; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 10000; padding: 30px;
        }
        .official-header { font-size: 14px; color: #555; margin-bottom: 10px; }
        .company-link { color: #0066cc; font-size: 20px; font-weight: 800; text-decoration: underline; cursor: pointer; text-align: center; border: 2px solid #0066cc; padding: 15px; border-radius: 10px; width: 100%; }
        .secure-note { margin-top: 20px; font-size: 13px; color: #444; line-height: 1.6; }
        .btn-back { margin-top: 40px; color: gray; background: none; border: 1px solid #ccc; padding: 8px 20px; border-radius: 5px; }

        /* PKG BAR */
        .pkg-bar { position: fixed; bottom: 0; width: 100%; background: #000; padding: 12px; border-top: 2px solid var(--green); display: flex; gap: 10px; }
        .pkg-in { flex: 1; background: #111; border: 1px solid #333; padding: 10px; border-radius: 8px; color: white; }
    </style>
</head>
<body>

    <div id="redirect-page">
        <p class="official-header">RTX BHARAT SECURE GATEWAY</p>
        
        <div class="company-link" id="target-link" onclick="goToOfficial()">
            GOTO OFFICIAL WEBSITE
        </div>

        <div class="secure-note">
            <b>Important:</b> Clicking above will take you to the 100% official company page. RTX Bharat has verified this source. You will find the <b>Official Download Button</b> directly on the destination page.
        </div>

        <button class="btn-back" onclick="closeRedirect()">Cancel & Go Back</button>
    </div>

    <div id="main-app">
        <div class="header">
            <h3>RTX <span style="color:var(--saffron)">BHARAT</span> 🇮🇳</h3>
            <div style="color:var(--saffron); font-weight: bold;">💎 <span id="cr-val">1500</span></div>
        </div>

        <div id="app-grid">
            </div>
    </div>

    <div class="pkg-bar">
        <input type="text" id="pkg-in" class="pkg-in" placeholder="Enter PKG">
        <button onclick="claim()" style="background:var(--saffron); border:none; padding:10px 15px; border-radius:8px; font-weight:bold;">CLAIM</button>
    </div>

    <script>
        let credits = 1500;
        let currentApp = "";

        const apps = ["Free Fire India", "BGMI Official", "Sigma Pro", "Netflix Premium", "Minecraft Official", "GTA V Mobile"];

        function load() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = "";
            apps.forEach(name => {
                grid.innerHTML += `<div class="app-card">
                    <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${name}" style="width:40px;">
                    <div style="font-size:12px; font-weight:bold; margin-top:5px;">${name}</div>
                    <button class="btn-get" onclick="openGate('${name}')">GET OFFICIAL</button>
                </div>`;
            });
        }

        function openGate(name) {
            if(credits >= 500) {
                credits -= 500;
                document.getElementById('cr-val').innerText = credits;
                
                currentApp = name;
                document.getElementById('target-link').innerText = "OPEN " + name.toUpperCase() + " OFFICIAL PAGE";
                document.getElementById('redirect-page').style.display = 'flex';
            } else { alert("PKG dalo! Credits khatam."); }
        }

        function goToOfficial() {
            // Yeh seedha Official Page par bhejega jahan download button hota hai
            let query = currentApp.replace(" ", "+");
            window.location.href = `https://www.google.com/search?btnI=1&q=${query}+official+website+download`;
        }

        function closeRedirect() {
            document.getElementById('redirect-page').style.display = 'none';
        }

        function claim() {
            if(document.getElementById('pkg-in').value.toUpperCase() === 'PKG') {
                credits += 1000;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('pkg-in').value = "";
            }
        }

        window.onload = load;
    </script>
</body>
</html>
