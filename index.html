<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX BHARAT v76.0 | REAL ENGINE</title>
    <style>
        :root { --saffron: #FF9933; --green: #138808; --bg: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 📡 FIXED TOP HEADER (RTX BRANDING) */
        .rtx-header { 
            background: #0a0a0a; padding: 15px; text-align: center; 
            border-bottom: 2px solid var(--saffron); z-index: 1000;
        }
        .rtx-header h1 { font-size: 18px; letter-spacing: 2px; }

        /* 🏠 HOMEPAGE CONTENT */
        #homepage { flex: 1; overflow-y: auto; padding: 15px; display: block; }
        .section-title { font-size: 12px; color: var(--saffron); margin: 20px 0 10px; text-transform: uppercase; }
        
        .app-card { 
            background: #111; border: 1px solid #222; border-radius: 12px; 
            padding: 15px; margin-bottom: 12px; display: flex; 
            align-items: center; justify-content: space-between; 
        }
        .app-info { display: flex; align-items: center; gap: 12px; }
        .app-info img { width: 40px; height: 40px; border-radius: 8px; }
        
        .btn { background: var(--green); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* 🔍 REAL GOOGLE VIEW (IFRAME) */
        #google-view { 
            display: none; flex: 1; width: 100%; border: none; background: white;
        }

        /* 🔙 BACK BUTTON FOR GOOGLE VIEW */
        #back-bar { 
            display: none; background: #f2f2f2; padding: 10px; 
            justify-content: space-between; align-items: center; color: black;
        }
    </style>
</head>
<body>

    <div class="rtx-header">
        <h1>RTX <span style="color:var(--saffron)">BHARAT</span></h1>
    </div>

    <div id="homepage">
        <div class="section-title">Premium Access</div>
        <div class="app-card">
            <div class="app-info">
                <img src="https://api.dicebear.com/7.x/initials/svg?seed=SP">
                <div><b>Spotify Premium</b><br><small style="color:gray;">Real Web Search</small></div>
            </div>
            <button class="btn" onclick="openRealGoogle('Spotify Premium Mod 2026')">SEARCH</button>
        </div>

        <div class="section-title">Direct Software</div>
        <div class="app-card">
            <div class="app-info">
                <img src="https://api.dicebear.com/7.x/initials/svg?seed=SB">
                <div><b>Sigma Battle</b><br><small style="color:gray;">Direct Softonic</small></div>
            </div>
            <button class="btn" onclick="openDirect('https://sigma-battle-royale.en.softonic.com/android/download')">GET</button>
        </div>
    </div>

    <div id="back-bar">
        <button onclick="closeGoogle()" style="padding: 5px 15px; font-weight: bold;">← BACK TO HOME</button>
        <span id="current-q" style="font-size: 12px; font-weight: bold;"></span>
    </div>

    <iframe id="google-view" src=""></iframe>

    <script>
        function openRealGoogle(query) {
            const encodedQuery = encodeURIComponent(query);
            // Asli Google Search URL load kar rahe hain
            const googleUrl = `https://www.google.com/search?q=${encodedQuery}&igu=1`; 
            
            document.getElementById('homepage').style.display = 'none';
            document.getElementById('back-bar').style.display = 'flex';
            document.getElementById('google-view').style.display = 'block';
            document.getElementById('google-view').src = googleUrl;
            document.getElementById('current-q').innerText = query;
        }

        function openDirect(url) {
            // Softonic jaise links ke liye direct window
            window.location.href = url;
        }

        function closeGoogle() {
            document.getElementById('homepage').style.display = 'block';
            document.getElementById('back-bar').style.display = 'none';
            document.getElementById('google-view').style.display = 'none';
            document.getElementById('google-view').src = "";
        }
    </script>
</body>
</html>
