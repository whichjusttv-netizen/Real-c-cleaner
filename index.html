<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-TUBE PRO | Fixed Version</title>
    <style>
        :root { --red: #ff0000; --dark: #0f0f0f; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        
        .user-bar { background: #1a1a1a; padding: 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
        .avatar { width: 30px; height: 30px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .header { padding: 20px; }
        .search-box { width: 90%; max-width: 500px; margin: auto; }
        input { width: 80%; padding: 12px; border-radius: 25px; border: none; background: #222; color: white; margin-bottom: 10px; }
        
        .btn-container { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .go-btn { padding: 12px 25px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .long { background: var(--red); }
        .shorts { background: #fff; color: #000; }

        .status-box { margin-top: 30px; padding: 20px; border: 1px dashed #444; border-radius: 15px; width: 80%; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

<div class="user-bar">
    <div style="display:flex; align-items:center; gap:10px;">
        <div class="avatar">R</div>
        <div style="text-align:left; font-size:12px;"><b>Ranjan</b><br><span style="color:#888;">ID: XT-2026-PRO</span></div>
    </div>
    <div style="font-size:10px; background:gold; color:black; padding:2px 5px; border-radius:3px; font-weight:bold;">X-STORE PRO</div>
</div>

<div class="header">
    <h1 style="color:var(--red); margin:0;">X-TUBE <span style="color:white">PRO</span></h1>
    <p style="font-size:12px; color:#666;">Global Search Engine - v3.0 (Fixed)</p>
</div>

<div class="search-box">
    <input type="text" id="query" placeholder="Type Movie Name or Channel...">
    <div class="btn-container">
        <button class="go-btn long" onclick="openVideo('long')">WATCH LONG</button>
        <button class="go-btn shorts" onclick="openVideo('shorts')">WATCH SHORTS</button>
    </div>
</div>

<div class="status-box">
    <p id="msg">Ready to stream... Enter keywords above.</p>
</div>

<script>
    function openVideo(type) {
        const val = document.getElementById('query').value;
        if(!val) { alert("Pehle kuch likho bhai!"); return; }

        document.getElementById('msg').innerText = "Connecting to Global Servers...";

        let finalUrl = "";
        if(type === 'long') {
            // Official YouTube Search Redirect (Works 100% in Apps)
            finalUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(val)}`;
        } else {
            // Official Shorts Redirect
            finalUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(val + " shorts")}`;
        }

        // Direct redirection taaki "Unable" wala error na aaye
        setTimeout(() => {
            window.location.href = finalUrl;
        }, 1000);
    }
</script>

</body>
</html>
