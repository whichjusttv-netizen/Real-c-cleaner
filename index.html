<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Store | Pro Edition</title>
    <style>
        :root { --primary: #01875f; --dark: #0f172a; --uptodown: #00a0e1; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: white; margin: 0; text-align: center; }
        
        .header { background: #000; padding: 25px; border-bottom: 3px solid var(--primary); }
        .logo { font-size: 30px; font-weight: 900; color: var(--primary); }

        .search-container { padding: 50px 20px; }
        #mainSearch {
            width: 85%; max-width: 550px; padding: 18px 25px; border-radius: 50px;
            border: 2px solid #334155; background: #1e293b; color: white; font-size: 18px; outline: none;
        }

        /* Secret Upload Icon Style */
        #uploadIcon {
            display: none; /* Pehle hide rahega */
            margin-top: 30px;
            cursor: pointer;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .upload-text { color: var(--uptodown); font-weight: bold; margin-top: 10px; display: none; }

        .footer { margin-top: 100px; color: #444; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">X-STORE GLOBAL</div>
</div>

<div class="search-container">
    <h2>Duniya Ke Saare Apps Ek Jagah</h2>
    <input type="text" id="mainSearch" placeholder="Search apps..." onkeyup="checkSecretKey()">
    
    <div id="secretSection">
        <div id="uploadIcon" onclick="goToUptodown()">
            <img src="https://img.icons8.com/fluency/96/upload-to-cloud.png" alt="Upload">
            <div class="upload-text" id="upText">PUBLISH TO UPTODOWN</div>
        </div>
    </div>
</div>

<div class="footer">© 2026 X-Store Portal | Secure Gateway</div>

<script>
    function checkSecretKey() {
        const input = document.getElementById('mainSearch').value.toUpperCase(); // PRK handle karne ke liye
        const icon = document.getElementById('uploadIcon');
        const text = document.getElementById('upText');

        // Agar user "PRK" search karega
        if (input === "PRK") {
            icon.style.display = "inline-block";
            text.style.display = "block";
        } else {
            icon.style.display = "none";
            text.style.display = "none";
        }
    }

    function goToUptodown() {
        // Direct link to Uptodown Developers/Publishing Section
        window.location.href = "https://developers.uptodown.com/";
    }
</script>

</body>
</html>
