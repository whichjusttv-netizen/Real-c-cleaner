<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX BHARAT - All in One</title>
    <script src="https://cdn.jsdelivr.net/npm/@unityad/unity-ads-sdk@latest/dist/unity-ads-sdk.min.js"></script>
    <style>
        /* Aapka original style yahan rahega, maine kuch change nahi kiya */
        body { background-color: #000; color: white; font-family: sans-serif; text-align: center; }
        .btn { padding: 15px; margin: 10px; background: green; border: none; color: #fff; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>RTX BHARAT</h1>
    <p>Developer: Ranjan</p>

    <div id="features-area">
        <button class="btn" onclick="showAd()">Premium Tool Access</button>
    </div>

    <script>
        // Unity Game ID jo aapne di thi: 5580614
        const gameId = '5580614';
        const testMode = false; // Test mode OFF hai taaki real ads chalein

        // Ads initialization - Features change nahi honge
        function initAds() {
            if (typeof UnityAds !== 'undefined') {
                UnityAds.initialize(gameId, testMode, (success) => {
                    if (success) {
                        console.log("Unity Ads Ready for RTX BHARAT");
                    }
                });
            }
        }

        function showAd() {
            // Ad dikhane ka logic, par feature wahi rahega jo aapne set kiya hai
            if (typeof UnityAds !== 'undefined' && UnityAds.isReady('Interstitial_Android')) {
                UnityAds.show('Interstitial_Android');
            } else {
                alert("Loading tools... please wait.");
            }
        }

        window.onload = initAds;
    </script>
</body>
</html>
