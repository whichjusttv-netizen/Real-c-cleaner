<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-PRO TERMINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/unity-ads-sdk@4.0.0/dist/unity-ads.min.js"></script>
    <style>
        :root { --neon: #00ff9d; --bg: #050505; --card: #121212; --pink: #ff0055; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; padding: 20px; text-align: center; }
        
        .container { max-width: 380px; margin: auto; border: 1px solid #333; border-radius: 15px; padding: 15px; background: var(--card); box-shadow: 0 0 20px rgba(0,255,157,0.1); }
        .header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; color: var(--neon); }
        
        .wallet { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--neon); }
        .coins { font-size: 32px; color: gold; font-weight: bold; }

        .task-btn { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid var(--neon); background: transparent; color: var(--neon); font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        .task-btn:active { background: var(--neon); color: #000; }
        
        .inst-box { font-size: 11px; color: #aaa; margin: 10px 0; background: #222; padding: 10px; border-radius: 5px; border: 1px dashed var(--pink); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">SYSTEM STATUS: ONLINE <br> ID: 6096974</div>
    
    <div class="wallet">
        <div style="font-size:10px;">TOTAL CREDITS</div>
        <div class="coins" id="coin-txt">0000</div>
    </div>

    <div class="inst-box">
        ⚠️ <b>IMPORTANT:</b> Agar Instagram install hai toh use open karein, warna Play Store se download karna padega tabhi credit milega!
    </div>

    <button class="task-btn" onclick="showAd()">Watch Ad (+50 Coins)</button>

    <button class="task-btn" style="border-color:var(--pink); color:var(--pink);" onclick="handleInstagramTask()">
        Open Instagram (+30 Coins)
    </button>

    <div id="status-log" style="font-size:10px; color:#555; margin-top:20px;">READY_</div>
</div>

<script>
    let credits = parseInt(localStorage.getItem('hack_credits')) || 0;
    const UNITY_ID = "6096974";

    function updateUI() {
        document.getElementById('coin-txt').innerText = credits.toString().padStart(4, '0');
        localStorage.setItem('hack_credits', credits);
    }
    updateUI();

    // Unity Ads Fixed Logic
    function showAd() {
        document.getElementById('status-log').innerText = "CONNECTING TO UNITY...";
        
        UnityAds.initialize(UNITY_ID, true, (success) => {
            if(success) {
                UnityAds.show('Rewarded_Android');
                // Simulatiing reward for testing
                setTimeout(() => {
                    credits += 50;
                    updateUI();
                    document.getElementById('status-log').innerText = "AD REWARD ADDED!";
                }, 5000);
            } else {
                alert("Ads Load Nahi Ho Rahe! Internet check karein.");
            }
        });
    }

    // Instagram Task Logic
    function handleInstagramTask() {
        const instagramAppUrl = "instagram://app"; // App kholne ke liye
        const playStoreUrl = "https://play.google.com/store/apps/details?id=com.instagram.android"; // Play Store link
        
        document.getElementById('status-log').innerText = "VERIFYING INSTAGRAM...";
        
        // Timer check karne ke liye ki app khula ya nahi
        let start = Date.now();
        window.location.href = instagramAppUrl;

        setTimeout(() => {
            // Agar 2 second baad bhi page focus mein hai, matlab app nahi khula
            if (Date.now() - start < 2500) {
                alert("Instagram install nahi hai! Play Store par ja kar download karein.");
                window.location.href = playStoreUrl;
            } else {
                // App khul gaya, toh reward de do
                credits += 30;
                updateUI();
                alert("Task Complete! 30 Coins Added.");
            }
        }, 2000);
    }
</script>

</body>
</html>
