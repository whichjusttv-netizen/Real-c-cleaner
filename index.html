<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-PRO ULTIMATE CONSOLE</title>
    <script src="https://cdn.jsdelivr.net/npm/unity-ads-sdk@4.0.0/dist/unity-ads.min.js"></script>
    <style>
        :root { --neon: #00ff9d; --yt: #ff0000; --blue: #0084ff; --bg: #05060f; --card: #12141d; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }

        /* Login Screen */
        #login-gate { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
        .gate-box { background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid var(--neon); text-align: center; width: 80%; max-width: 320px; }
        .gate-input { width: 100%; padding: 12px; margin: 20px 0; background: #000; border: 1px solid #333; color: var(--neon); border-radius: 10px; text-align: center; outline: none; }
        .gate-btn { background: var(--neon); color: #000; font-weight: bold; padding: 12px 30px; border: none; border-radius: 10px; cursor: pointer; width: 100%; }

        /* Main Dashboard */
        #app-content { display: none; padding: 15px; }
        
        /* Top Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .status-light { font-size: 10px; color: var(--neon); }

        /* Center: Reward & App Vault Section */
        .vault-container { background: linear-gradient(180deg, #1a1c25, #000); border-radius: 20px; padding: 15px; border: 1px solid #333; margin-bottom: 20px; }
        .wallet { font-size: 40px; color: gold; font-weight: 800; margin: 10px 0; display: block; }
        
        /* Side-by-Side Task Buttons */
        .task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .t-btn { padding: 15px; border-radius: 15px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .t-reward { background: var(--neon); color: #000; }
        .t-mono { background: var(--yt); color: #fff; }
        .t-btn:active { transform: scale(0.95); }

        /* Secret Apps Section (The "Bich wala" Reward System) */
        .app-list { text-align: left; background: #000; border-radius: 15px; padding: 10px; border: 1px solid #222; }
        .app-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #111; }
        .app-icon { width: 45px; height: 45px; background: #222; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .extract-btn { background: var(--blue); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 11px; }

        .footer-info { font-size: 9px; color: #444; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-gate">
        <div class="gate-box">
            <h2 style="margin:0; color:var(--neon)">X-PRO SECURE</h2>
            <p style="font-size:11px; color:#888;">AUTHORIZED ACCESS ONLY</p>
            <input type="password" id="passkey" class="gate-input" placeholder="Enter Password">
            <button class="gate-btn" onclick="unlock()">UNLOCK CONSOLE</button>
        </div>
    </div>

    <div id="app-content">
        <div class="top-bar">
            <span style="font-weight: bold; color:var(--neon)">AARTI-X v1.0</span>
            <span class="status-light">● SYSTEM ONLINE</span>
        </div>

        <div class="vault-container" style="text-align: center;">
            <span style="font-size: 11px; color: #888; letter-spacing: 2px;">CREDITS BALANCE</span>
            <span class="wallet" id="coin-txt">0000</span>
        </div>

        <div class="task-grid">
            <button class="t-btn t-reward" onclick="unityAdTask()">⚡ REWARDS <br>(UNITY ADS)</button>
            <button class="t-btn t-mono" onclick="monetizeTask()">📺 YOUTUBE <br>MONETIZE</button>
        </div>

        <div class="app-list">
            <p style="margin: 0 0 10px 5px; color: gold; font-weight: bold; font-size: 13px;">VAULT: SECRET APPS (CHROME LINKS)</p>
            
            <div class="app-item">
                <div class="app-icon">W</div>
                <div style="flex-grow:1; margin-left:12px;">
                    <div style="font-size:14px; font-weight:bold;">GB WhatsApp Pro</div>
                    <div style="font-size:10px; color:#555;">Official Anti-Ban</div>
                </div>
                <button class="extract-btn" onclick="getSecretLink('https://androidwaves.com/download-gbwhatsapp-pro-apk/', 100)">EXTRACT</button>
            </div>

            <div class="app-item">
                <div class="app-icon" style="color:red">V</div>
                <div style="flex-grow:1; margin-left:12px;">
                    <div style="font-size:14px; font-weight:bold;">Vidmate Premium</div>
                    <div style="font-size:10px; color:#555;">HD Downloader</div>
                </div>
                <button class="extract-btn" onclick="getSecretLink('https://www.vidmateapp.com/', 80)">EXTRACT</button>
            </div>

            <div class="app-item">
                <div class="app-icon" style="color:blue">M</div>
                <div style="flex-grow:1; margin-left:12px;">
                    <div style="font-size:14px; font-weight:bold;">Mod Master Tool</div>
                    <div style="font-size:10px; color:#555;">Unlimited Coins</div>
                </div>
                <button class="extract-btn" onclick="getSecretLink('https://modmaster.org/', 150)">EXTRACT</button>
            </div>
        </div>

        <div class="footer-info">POWERED BY GOOGLE CLOUD | UNITY ID: 6096974</div>
    </div>

<script>
    const SECRET = "Aarti X";
    const UNITY_ID = "6096974";
    let coins = parseInt(localStorage.getItem('sys_coins')) || 0;

    function updateUI() {
        document.getElementById('coin-txt').innerText = coins.toString().padStart(4, '0');
        localStorage.setItem('sys_coins', coins);
    }

    // Password Logic
    function unlock() {
        let input = document.getElementById('passkey').value;
        if(input === SECRET) {
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            updateUI();
            initUnity();
        } else {
            alert("❌ Wrong Password! Hint: Check User Name.");
        }
    }

    // Unity Logic
    function initUnity() {
        UnityAds.initialize(UNITY_ID, true);
    }

    function unityAdTask() {
        alert("Connecting Unity Ad Server...");
        UnityAds.show('Rewarded_Android');
        // Reward Logic
        setTimeout(() => {
            coins += 50;
            updateUI();
            alert("50 Credits Added via Unity Ads!");
        }, 3000);
    }

    // YouTube Monetization Logic
    function monetizeTask() {
        alert("Opening Monetization Target...");
        window.open('https://www.youtube.com/c/YOUR_CHANNEL_LINK', '_blank');
        setTimeout(() => {
            coins += 100;
            updateUI();
            alert("100 Credits Added via YouTube Monetization!");
        }, 10000);
    }

    // Chrome Redirect System
    function getSecretLink(url, cost) {
        if(coins >= cost) {
            coins -= cost;
            updateUI();
            alert("Access Granted! Opening Chrome for Official App Page.");
            window.open(url, '_blank');
        } else {
            alert("Coins Kam Hain! Task poora karo.");
        }
    }
</script>
</body>
</html>
