<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX DUAL-ENGINE v37.0</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000; --gold: #ffcc00; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        /* 🌈 RGB BORDER (Non-Stop) */
        @keyframes rgb-flow {
            0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }

        body { 
            background: var(--bg); color: white; height: 100vh; overflow: hidden; 
            display: flex; flex-direction: column; 
            border: 4px solid #ff0000; animation: rgb-flow 3s linear infinite;
        }

        /* 🔐 LOCK SCREEN */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
        }

        /* 📱 MAIN DASHBOARD */
        #main-app { display: none; height: 100vh; flex-direction: column; padding: 10px; position: relative; }

        /* 💰 TOP LEFT CREDITS */
        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .credits-display { border: 1px solid var(--gold); color: var(--gold); padding: 5px 12px; border-radius: 50px; font-weight: bold; font-size: 13px; background: rgba(255, 204, 0, 0.05); }

        /* 🔍 SEARCH AREA */
        .search-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-bar { background: #111; border: 1px solid var(--neon); flex: 1; padding: 12px; border-radius: 12px; color: white; outline: none; }
        .lb-trigger { background: var(--neon); border: none; width: 45px; border-radius: 12px; font-size: 18px; box-shadow: 0 0 10px var(--neon); }

        /* 🏆 TRENDING SIDE PANEL (Editing DB) */
        #side-panel {
            position: fixed; top: 0; right: -100%; width: 85%; height: 100%;
            background: rgba(5, 5, 5, 0.98); border-left: 2px solid var(--neon);
            z-index: 5000; transition: 0.4s ease; padding: 20px;
        }
        #side-panel.active { right: 0; }
        .trend-item { background: #111; padding: 15px; margin-bottom: 8px; border-radius: 10px; border: 1px solid #333; display: flex; justify-content: space-between; }

        /* 📦 3D INFINITE APP GRID (1Cr Engine) */
        #app-grid { 
            flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            padding-bottom: 20px; perspective: 1000px; scrollbar-width: none;
        }
        #app-grid::-webkit-scrollbar { display: none; }
        
        .app-card { 
            background: #0d0d0d; border: 1px solid #222; border-radius: 15px; padding: 15px; 
            text-align: center; transform: rotateX(5deg); transition: 0.3s;
        }
        .app-card:active { transform: scale(0.95) rotateX(0deg); border-color: var(--neon); }

        /* 💰 BOTTOM PKG BORDER */
        .bottom-border { border-top: 1px solid var(--gold); padding: 12px 5px; background: #000; margin-top: auto; }
        .pkg-row { display: flex; gap: 8px; }
        .pkg-input { background: #111; border: 1px solid var(--gold); flex: 1; padding: 12px; border-radius: 10px; color: white; outline: none; letter-spacing: 1px; }
        .claim-btn { background: var(--gold); color: black; border: none; padding: 12px 18px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h2 style="color:var(--neon); margin-bottom:20px; letter-spacing:3px;">RTX DUAL-ENGINE</h2>
        <input type="password" id="pin" style="background:#111; border:1px solid #333; padding:15px; color:white; border-radius:10px; text-align:center;" placeholder="ACCESS PIN">
        <button onclick="unlock()" style="margin-top:20px; width:180px; background:var(--neon); padding:12px; border-radius:10px; border:none; font-weight:bold;">INITIALIZE</button>
    </div>

    <div id="main-app">
        <div class="header-ui">
            <div class="credits-display">💎 <span id="cr-count">1500</span> CREDITS</div>
            <div style="font-size:10px; color:var(--neon);">ENGINE: DUAL-DB v37</div>
        </div>

        <div class="search-row">
            <input type="text" class="search-bar" placeholder="Search 1Cr+ Apps..." id="s-input" onkeyup="searchApps()">
            <button class="lb-trigger" onclick="toggleSide()">🏆</button>
        </div>

        <div id="side-panel">
            <h3 style="color:var(--neon); margin-bottom:20px;">TRENDING SCANNER</h3>
            <div id="trend-list"></div>
            <button onclick="toggleSide()" style="margin-top:20px; background:red; color:white; width:100%; padding:12px; border:none; border-radius:10px;">BACK</button>
        </div>

        <div id="app-grid"></div>

        <div class="bottom-border">
            <div class="pkg-row">
                <input type="text" id="pkg-code" class="pkg-input" placeholder="Enter PKG Code">
                <button class="claim-btn" onclick="addCredits()">CLAIM</button>
            </div>
        </div>
    </div>

    <script>
        let credits = 1500;
        
        // 💾 DATABASE 1: MAIN VAULT (1 Crore Apps Logic)
        const mainVault = ["Free Fire MAX", "Sigma", "Minecraft", "Netflix Premium", "GTA V Mobile", "Instagram Gold", "Termux RTX", "BGMI Mod", "Spotify Pro", "Roblox Hack"];

        // 💾 DATABASE 2: EDITING/TRENDING DB
        const trendingDB = ["Sigma Battle Royale", "Free Fire MAX Mod"];

        function unlock() {
            let p = document.getElementById('pin').value.toUpperCase();
            if(p === 'RTX' || p === '1111') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                loadEngines();
            }
        }

        function loadEngines() {
            const grid = document.getElementById('app-grid');
            const side = document.getElementById('trend-list');
            grid.innerHTML = "";
            side.innerHTML = "";

            // Logic: Trending apps ko top par lana (Editing DB check)
            let combinedList = [...new Set([...trendingDB, ...mainVault])];

            combinedList.forEach((name, index) => {
                let isTrending = trendingDB.includes(name);
                
                // Add to Main Grid (3D Cards)
                grid.innerHTML += `
                    <div class="app-card" data-name="${name}">
                        <div style="font-size:25px">${isTrending ? '🔥' : '💎'}</div>
                        <h4 style="font-size:12px; margin:5px 0;">${name}</h4>
                        <span style="font-size:9px; color:${isTrending ? 'var(--neon)' : 'var(--gold)'}">${isTrending ? 'TOP TREND' : 'PREMIUM'}</span>
                        <button onclick="goToChrome()" style="margin-top:10px; background:var(--neon); border:none; padding:6px 12px; border-radius:6px; font-size:10px; font-weight:bold;">GET LINK</button>
                    </div>
                `;

                // Add to Side Panel (Leaderboard)
                if(isTrending) {
                    side.innerHTML += `<div class="trend-item"><span>#${index+1} ${name}</span><span style="color:var(--neon)">HOT</span></div>`;
                }
            });
        }

        function goToChrome() {
            if(credits >= 500) {
                credits -= 500;
                document.getElementById('cr-count').innerText = credits;
                alert("Dual-Engine: Redirecting to Chrome...");
                window.location.href = "https://www.google.com/search?q=direct+download+premium+mod+apps";
            } else {
                alert("Need 500 Credits!");
            }
        }

        function toggleSide() { document.getElementById('side-panel').classList.toggle('active'); }

        function addCredits() {
            let code = document.getElementById('pkg-code').value.toUpperCase();
            if(code === 'PKG' || code === 'RANJAN_PRO') {
                credits += 1000;
                document.getElementById('cr-count').innerText = credits;
                document.getElementById('pkg-code').value = "";
                alert("+1000 Credits Injected!");
            }
        }

        function searchApps() {
            let val = document.getElementById('s-input').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            for(let card of cards) {
                let n = card.getAttribute('data-name').toLowerCase();
                card.style.display = n.includes(val) ? "block" : "none";
            }
        }
    </script>
</body>
</html>
