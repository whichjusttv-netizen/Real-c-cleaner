<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX BHARAT v64.0</title>
    <style>
        :root { --saffron: #FF9933; --white: #FFFFFF; --green: #2e7d32; --bg: #000000; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        body { background: #111; color: white; height: 100vh; display: flex; justify-content: center; overflow: hidden; align-items: flex-start; }

        /* COMPACT DESIGN */
        #main-container { 
            width: 96%; max-width: 400px; height: 98vh; background: var(--bg);
            border-top: 3px solid var(--saffron); border-left: 1px solid #333; border-right: 1px solid #333;
            display: flex; flex-direction: column; position: relative;
        }

        .header { padding: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        
        .rolling-bar { background: #1a1a1a; padding: 5px; font-size: 10px; color: var(--saffron); overflow: hidden; white-space: nowrap; }
        .rolling-text { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* PREMIUM GAMES GRID */
        #game-list { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; padding-bottom: 80px; scrollbar-width: none; }
        .game-card { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 10px; text-align: center; border-bottom: 2px solid var(--green); }
        .game-card img { width: 40px; border-radius: 8px; margin-bottom: 5px; }
        .btn-target { background: var(--green); color: white; border: none; padding: 8px; border-radius: 4px; font-size: 10px; font-weight: 900; width: 100%; cursor: pointer; }

        /* ⚪ DIRECT LANDING NOTICE (White Page) */
        #notice-page { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; color: black; display: none; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 25px; padding-top: 60px;
        }
        
        /* 🚨 NEW: TOP REDIRECT NOTICE BAR */
        #redirect-bar {
            position: absolute; top: 0; left: 0; width: 100%; background: #f8f9fa; border-bottom: 2px solid #dadce0;
            padding: 12px; font-size: 11px; text-align: left; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .redirect-title { color: #d32f2f; font-weight: 900; font-size: 12px; margin-bottom: 4px; display: block; }
        .redirect-url { color: #1a73e8; text-decoration: underline; font-weight: bold; }

        .soft-tag { background: var(--green); color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-bottom: 15px; }
        .box { border: 2px solid #ddd; border-radius: 12px; padding: 20px; width: 100%; text-align: center; }
        .main-btn { background: var(--green); color: white; padding: 16px; border-radius: 8px; text-decoration: none; width: 100%; display: block; text-align: center; font-weight: bold; margin-top: 20px; font-size: 18px; }

        .pkg-section { position: absolute; bottom: 0; width: 100%; background: #000; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #333; }
        .pkg-in { flex: 1; background: #111; border: 1px solid #444; padding: 8px; border-radius: 5px; color: white; }
    </style>
</head>
<body>

    <div id="main-container">
        <div class="header">
            <span style="font-weight: 900;">RTX <span style="color:var(--saffron)">BHARAT</span></span>
            <div style="color:var(--saffron); font-weight: bold;">💎 <span id="cr-val">1500</span></div>
        </div>

        <div class="rolling-bar"><div class="rolling-text">🔥 DIRECT SOFTONIC SERVERS CONNECTED | SIGMA PRO X SECURE LINK ACTIVE 🚀</div></div>

        <div id="game-list"></div>

        <div id="notice-page">
            
            <div id="redirect-bar">
                <span class="redirect-title">⚠️ Redirect Notice</span>
                The app is redirecting you to: <br>
                <span class="redirect-url" id="display-url">https://example.com</span>
            </div>

            <div class="soft-tag">SOFT Secure Engine</div>
            <div class="box">
                <h2 id="t-game">GAME NAME</h2>
                <p style="font-size:12px; color:#666; margin-top:10px;">Connection Established! Click below to jump directly to the <b>Official Softonic Download Page</b>.</p>
            </div>
            
            <a href="#" class="main-btn" id="f-link">SECURE DOWNLOAD</a>
            <button onclick="closeP()" style="margin-top:20px; color:gray; background:none; border:none; text-decoration:underline; font-weight:bold;">Cancel</button>
        </div>

        <div class="pkg-section">
            <input type="text" id="pkg-in" class="pkg-in" placeholder="PKG CODE">
            <button onclick="claim()" style="background:var(--saffron); border:none; padding:8px 12px; border-radius:5px; font-weight:bold; color:black;">CLAIM</button>
        </div>
    </div>

    <script>
        let credits = 1500;
        
        // 🎯 EXACT SOFTONIC DIRECT LINKS
        const gameLinks = {
            "Sigma Pro X": "https://sigma-battle-royale-re9.en.softonic.com/android/download",
            "GTA 5 Mobile": "https://grand-theft-auto-v-gta-5.en.softonic.com/android/download",
            "Free Fire Advance": "https://free-fire-advance.en.softonic.com/android/download",
            "Minecraft": "https://minecraft.en.softonic.com/android/download",
            "BGMI Mod": "https://battlegrounds-mobile-india.en.softonic.com/android/download"
        };

        const games = [
            "Sigma Pro X", "GTA 5 Mobile", "Free Fire Advance", "Minecraft", "BGMI Mod",
            "Fortnite Android", "Call of Duty", "PUBG KR", "WhatsApp Plus", "Roblox",
            "FIFA 25 Mod", "Tekken 8 Mobile", "Apex Legends", "Spider-Man 2", "God of War", 
            "Resident Evil 4", "Bully", "GTA San Andreas", "Valorant Mobile", "Elden Ring", 
            "Clash of Clans", "Need For Speed", "Hitman", "Among Us", "Project Blood", 
            "Cyberpunk", "Total Overdose", "WWE 2K25", "Fall Guys", "Sigma Battle"
        ];

        function load() {
            const grid = document.getElementById('game-list');
            grid.innerHTML = "";
            games.forEach(name => {
                grid.innerHTML += `<div class="game-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${name}" style="width:40px;">
                    <div style="font-size:10px; font-weight:bold; margin:5px 0;">${name}</div>
                    <button class="btn-target" onclick="openP('${name}')">TARGET LINK</button>
                </div>`;
            });
        }

        function openP(name) {
            if(credits >= 500) {
                credits -= 500;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('t-game').innerText = name.toUpperCase();
                
                let directUrl = gameLinks[name];
                if (!directUrl) {
                    let q = name.toLowerCase().replace(/\s+/g, '-');
                    directUrl = `https://${q}.en.softonic.com/android/download`;
                }
                
                // 🚨 UPDATE THE REDIRECT NOTICE TEXT AND MAIN LINK
                document.getElementById('f-link').href = directUrl;
                document.getElementById('display-url').innerText = directUrl;
                
                document.getElementById('notice-page').style.display = 'flex';
            } else { alert("Coins Needed!"); }
        }

        function closeP() { document.getElementById('notice-page').style.display = 'none'; }

        function claim() {
            if(document.getElementById('pkg-in').value.toUpperCase() === 'PKG') {
                credits += 1000;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('pkg-in').value = "";
            }
        }
        window.onload = load;
    </script>
</body>
</html>
