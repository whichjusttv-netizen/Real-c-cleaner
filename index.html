        /* SECURITY GATEWAY */

        #app { display: none; }

        .wallet { background: #000; padding: 15px; border-radius: 20px; border: 1px solid #333; margin: 10px 0; }

        /* 100 APPS VERTICAL SCROLL */
        .app-grid { display: flex; flex-direction: column; gap: 12px; padding: 10px 0; max-height: 65vh; overflow-y: auto; scrollbar-width: none; }

        .card { 
            background: #1a1c25; border: 1px solid #333; border-radius: 15px; 
            padding: 15px; text-align: left; display: flex; justify-content: space-between; align-items: center;
        }
        .info h3 { color: var(--neon); margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .info p { font-size: 10px; color: #555; margin: 4px 0 0 0; font-style: italic; }
        .get-btn { background: var(--safe); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; }

        /* REWARD SYSTEM */
        .secret-box { background: #000; padding: 15px; border-radius: 20px; border: 1px solid var(--gold); margin-top: 15px; }
        .code-input { width: 80%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: none; text-align: center; background: #111; color: var(--gold); font-weight: bold; font-size: 16px; }
    </style>
</head>

    function updateUI() {
        document.getElementById('coin-txt').innerText = sc.toString().padStart(4,'0') + " CR";

</html>
