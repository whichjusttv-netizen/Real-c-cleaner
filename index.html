<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-VOICE | Speaker Fixed</title>
    <style>
        :root { --neon: #00ff41; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .studio-card { background: #111; padding: 30px; border-radius: 25px; border: 2px solid var(--neon); box-shadow: 0 0 20px var(--neon); }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: red; color: white; font-size: 30px; cursor: pointer; margin-bottom: 20px; }
        .playing { animation: pulse 1s infinite; background: var(--neon); color: black; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .status { color: var(--neon); font-family: monospace; margin-top: 15px; }
    </style>
</head>
<body>

<h2 style="color:var(--neon)">X-VOICE <span style="color:white">LIVE STUDIO</span></h2>
<p style="font-size:10px; color:gray;">FIXED VERSION 4.5 | OWNER: RANJAN</p>

<div class="studio-card">
    <button id="recBtn" class="mic-btn" onclick="toggleStudio()">🎤</button>
    <div id="status" class="status">SYSTEM IDLE: PRESS MIC TO START</div>
    
    <div style="margin-top:20px; padding:15px; background:#222; border-radius:10px;">
        <p style="font-size:12px; margin:0;">Speaker Output: <span id="out">OFF</span></p>
    </div>
</div>

<script>
    let audioContext;
    let microphone;
    let isRecording = false;

    async function toggleStudio() {
        const btn = document.getElementById('recBtn');
        const status = document.getElementById('status');
        const out = document.getElementById('out');

        if (!isRecording) {
            try {
                // Mic aur Speaker ki permission mangega
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                microphone = audioContext.createMediaStreamSource(stream);
                
                // Ye hai asli "Mixing" jisse speaker par awaz aayegi
                microphone.connect(audioContext.destination);

                btn.classList.add('playing');
                btn.innerText = "🛑";
                status.innerText = "RECORDING & PLAYING LIVE...";
                out.innerText = "LIVE ON SPEAKER";
                isRecording = true;

                // AI Intro
                const msg = new SpeechSynthesisUtterance("Live monitoring enabled. Your voice is now on speaker.");
                window.speechSynthesis.speak(msg);

            } catch (err) {
                alert("Bhai, Mic ki permission toh dedo! Settings check karo.");
                console.log(err);
            }
        } else {
            // Sab band karo
            if (audioContext) audioContext.close();
            btn.classList.remove('playing');
            btn.innerText = "🎤";
            status.innerText = "STUDIO STOPPED. READY TO SYNC.";
            out.innerText = "OFF";
            isRecording = false;
        }
    }
</script>

</body>
</html>
