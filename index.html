<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRAL BOOSTER | RANJAN PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/unity-ads-sdk@4.0.0/dist/unity-ads.min.js"></script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .warning-board { background: #ff00551a; border: 1px solid #ff0055; padding: 15px; margin: 10px; border-radius: 10px; color: #ff0055; font-weight: bold; font-size: 14px; }
        .main-card { border: 2px solid #00ff00; padding: 25px; margin: 20px auto; max-width: 360px; border-radius: 20px; background: #000; box-shadow: 0 0 30px rgba(0,255,0,0.1); }
        .btn-ad { background: #00ff00; color: #000; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .input-box { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; margin-top: 15px; display: none; }
        #submit-btn { display: none; background: cyan; color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="warning-board">
        ⚠️ DHAYAN SE PADHEIN: <br>
        Bina Ads dekhe aap Viral Booster use nahi kar sakte. <br>
        2 Ads = 100 Coins = 10 Comments + Shares + Promotion!
    </div>

    <div class="main-card">
        <h2 style="color:#00ff00; margin-top:0;">X-BOOSTER</h2>
        <div style="font-size: 18px; color: gold;">Coins: <span id="c-count">0</span></div>
        
        <p style="font-size: 12px; color:#888; margin: 20px 0;">Ads dekh kar 100 Coins jama karein aur apni video viral karein!</p>
        
        <button class="btn-ad" onclick="playUnityAd()">WATCH AD (+50 COINS)</button>

        <input type="text" id="v-link" class="input-box" placeholder="Video Link Paste Karein...">
        <button id="submit-btn" onclick="sendToRanjan()">SUBMIT FOR PROMOTION</button>

        <div id="status" style="font-size: 10px; color: #444; margin-top: 20px;">API STATUS: 6096974 ACTIVE</div>
    </div>

<script>
    const UNITY_ID = "6096974";
    let myCoins = parseInt(localStorage.getItem('booster_coins')) || 0;

    function refreshUI() {
        document.getElementById('c-count').innerText = myCoins;
        localStorage.setItem('booster_coins', myCoins);
        
        if(myCoins >= 100) {
            document.getElementById('v-link').style.display = "block";
            document.getElementById('submit-btn').style.display = "block";
        }
    }
    refreshUI();

    function playUnityAd() {
        // Unity Ads Initialize and Show
        UnityAds.initialize(UNITY_ID, true, (success) => {
            if(success) {
                UnityAds.show('Rewarded_Android');
                
                // Reward logic (Ad dekhne ke baad)
                setTimeout(() => {
                    myCoins += 50;
                    refreshUI();
                    alert("Shabash! 50 Coins add ho gaye.");
                }, 5000); 
            } else {
                alert("API Error! Connection check karein.");
            }
        });
    }

    function sendToRanjan() {
        let link = document.getElementById('v-link').value;
        if(link.length > 5) {
            // Success Message
            alert("✅ Link Submitted!\nRanjan Bhai ko aapka link mil gaya hai. Agle 24 ghante mein promotion shuru ho jayega.");
            
            // Coins katna
            myCoins -= 100;
            refreshUI();
            
            // Link ko console ya database mein bhejna (Abhi ke liye alert)
            console.log("Promotion for: " + link);
        } else {
            alert("Pehle sahi video link dalo!");
        }
    }
</script>

</body>
</html>
