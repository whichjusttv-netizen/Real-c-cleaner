<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protocol-X</title>
    <style>
        /* Status bar se duri banane ke liye padding */
        body { margin: 0; padding-top: env(safe-area-inset-top); background: #202124; font-family: sans-serif; }
        
        #header {
            background: #35363a;
            padding: 15px 12px; /* Status bar ke liye jagah */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #url-input {
            flex: 1;
            background: #121212;
            border: 1px solid #444;
            color: #00ff00;
            padding: 10px;
            border-radius: 20px;
            outline: none;
        }

        #browser-view {
            width: 100%;
            height: calc(100vh - 70px); /* Status bar ki jagah chhodi */
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>

<div id="header">
    <input type="text" id="url-input" placeholder="Website ya URL daalein...">
    <button onclick="go()" style="background:#00ff00; border:none; padding:10px 15px; border-radius:15px; font-weight:bold;">GO</button>
</div>

<!-- Pehle empty rahega, Google load nahi hoga -->
<iframe id="browser-view" src="about:blank"></iframe>

<script>
    function go() {
        let val = document.getElementById('url-input').value.trim();
        if(!val) return;
        
        let url = val.startsWith('http') ? val : 'https://' + val;
        // Direct Proxy, no google interference
        document.getElementById('browser-view').src = "https://www.croxyproxy.com/_p/index.php?q=" + btoa(url);
    }
</script>

</body>
</html>
