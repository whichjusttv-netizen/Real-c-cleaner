<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX BHARAT v58.0</title>
    <style>
        :root { --saffron: #FF9933; --white: #FFFFFF; --green: #138808; --bg: #050505; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* MAIN UI */
        #main-app { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--saffron); padding-bottom: 10px; margin-bottom: 20px; }
        
        #app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; overflow-y: auto; padding-bottom: 100px; scrollbar-width: none; }
        .app-card { background: #111; border: 1px solid #222; border-radius: 20px; padding: 15px; text-align: center; border-top: 3px solid var(--saffron); }
        .btn-get { background: var(--saffron); border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; color: black; cursor: pointer; }

        /* ⚪ THE MULTI-SOURCE SECURE PAGE */
        #secure-hub { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; color: black; display: none; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 10000; padding: 25px;
        }
        .source-box { width: 100%; background: #f9f9f9; border: 2px solid #ddd; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .download-btn { background: #007bff; color: white; padding: 12px; border-radius: 8px; text-decoration: none; display: block; text-align: center; font-weight: bold; margin-top: 10px; }
        .softonic-btn { background: #222; } /* Dark theme for Softonic feel */
        .uptodown-btn { background: #2e7d32; } /* Green for Uptodown feel */

        /* PKG BAR */
        .pkg-bar { position: fixed; bottom: 0; width: 100%; background: #000; padding: 15px; border-top: 2px solid var(--green); display: flex; gap: 10px; }
        .pkg-in { flex: 1; background: #111; border: 1px solid #333; padding: 12px; border-radius: 10px; color: white; }
    </style>
</head>
<body>

    <div id="secure-hub">
        <h2 style="margin-bottom: 20px;">🛡️ RTX SECURE GATEWAY</h2>
        
        <div class="source-box">
            <b id="app-name-display">App Name</b>
            <p style="font-size: 12px; color: #666;">Choose a Trusted Source for Download:</p>
            
            <a href="#" class="download-btn softonic-btn" id="softonic-link" onclick="track()">DOWNLOAD FROM SOFTONIC</a>
            
            <a href="#" class="download-btn uptodown-btn" id="uptodown-link" onclick="track()">DOWNLOAD FROM UPTODOWN</a>
        </div>

        <p style="font-size: 11px; text-align: center; padding: 10px;">
            RTX Bharat has connected with <b>Softonic</b> and <b>Uptodown</b> servers to give you 100% verified files.
        </p>

        <button onclick="closeHub()" style="background:none; border:none; color:gray; text-decoration:underline; margin-top:20px;">Cancel and Return</button>
    </div>

    <div id="main-app">
        <div class="header">
            <h3>RTX <span style="color:var(--saffron)">BHARAT</span> 🇮🇳</h3>
            <div style="font-weight:bold;">💎 <span id="cr-val">1500</span></div>
        </div>

        <div id="app-grid">
            </div>
    </div>

    <div class="pkg-bar">
        <input type="text" id="pkg-in" class="pkg-in" placeholder="Enter PKG">
        <button onclick="claim()" style="background:var(--saffron); border:none; padding:0 20px; border-radius:10px; font-weight:bold;">CLAIM</button>
    </div>

    <script>
        let credits = 1500;
        const premiumApps = ["Sigma Pro X", "FF Advance", "BGMI Mod", "GTA 5", "Minecraft", "GB WhatsApp", "Lucky Patcher", "HappyMod", "CapCut", "VideoDer"];

        function load() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = "";
            premiumApps.forEach(name => {
                grid.innerHTML += `<div class="app-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${name}" style="width:40px;">
                    <div style="font-size:12px; font-weight:bold; margin-top:5px;">${name}</div>
                    <button class="btn-get" onclick="openHub('${name}')">DOWNLOAD</button>
                </div>`;
            });
        }

        function openHub(name) {
            if(credits >= 500) {
                credits -= 500;
                document.getElementById('cr-val').innerText = credits;
                
                document.getElementById('app-name-display').innerText = name.toUpperCase();
                
                // Logic to set Softonic and Uptodown links
                let q = name.replace(" ", "-").toLowerCase();
                document.getElementById('softonic-link').href = `https://en.softonic.com/s/${q}`;
                document.getElementById('uptodown-link').href = `https://en.uptodown.com/android/search/${q}`;
                
                document.getElementById('secure-hub').style.display = 'flex';
            } else { alert("Coins Low!"); }
        }

        function closeHub() { document.getElementById('secure-hub').style.display = 'none'; }
        
        function track() { console.log("Direct Official Redirect Activated"); }

        function claim() {
            if(document.getElementById('pkg-in').value.toUpperCase() === 'PKG') {
                credits += 1000;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('pkg-in').value = "";
            }
        }

        window.onload = load;
    </script>
</body>
</html>
