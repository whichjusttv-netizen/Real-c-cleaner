<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan System Optimizer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; margin: 0; text-align: center; }
        
        /* Permission Box Styling */
        #permission-box {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .window { background: #fff; color: #333; width: 85%; padding: 25px; border-radius: 12px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .window h3 { margin: 0 0 10px 0; font-size: 18px; color: #000; }
        .window p { font-size: 14px; color: #555; line-height: 1.4; }
        .actions { display: flex; justify-content: flex-end; margin-top: 20px; gap: 20px; }
        .btn-link { background: none; border: none; font-weight: bold; font-size: 15px; cursor: pointer; text-transform: uppercase; }
        
        /* Main Cleaner UI */
        #app-content { display: none; padding-top: 50px; }
        .scan-circle { width: 150px; height: 150px; border: 6px solid #007bff; border-radius: 50%; margin: 30px auto; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; border-top-color: transparent; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { color: #007bff; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="permission-box">
        <div class="window">
            <h3>System Access Required</h3>
            <p>Allow <b>Ranjan Optimizer</b> to access system storage and cache logs to clean junk files on your device?</p>
            <div class="actions">
                <button class="btn-link" style="color: #777;" onclick="alert('Access Denied. App will close.')">DENY</button>
                <button class="btn-link" style="color: #007bff;" onclick="startApp()">ALLOW</button>
            </div>
        </div>
    </div>

    <div id="app-content">
        <h2 style="color:#007bff">SYSTEM SCANNING...</h2>
        <div class="scan-circle" id="circle-text">0%</div>
        <p id="log-info">> Locating junk fragments...</p>
    </div>

    <script>
        function startApp() {
            document.getElementById('permission-box').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            
            let percent = 0;
            let logs = ["> Scanning Cache...", "> Deleting Temp Files...", "> RAM Optimization...", "> System Shield Active"];
            
            let timer = setInterval(() => {
                percent += 2;
                document.getElementById('circle-text').innerText = percent + "%";
                
                if(percent % 25 == 0) {
                    document.getElementById('log-info').innerText = logs[(percent/25)-1];
                }

                if(percent >= 100) {
                    clearInterval(timer);
                    document.getElementById('circle-text').innerText = "DONE";
                    document.getElementById('circle-text').style.animation = "none";
                    document.getElementById('circle-text').style.borderColor = "#00ff00";
                    
                    setTimeout(() => {
                        alert("Ranjan bhai, scan poora ho gaya! Ab asali safai ka rasta khul raha hai.");
                        // ASALI JADOO: Ye phone ki settings khol dega
                        window.location.href = "intent:#Intent;action=android.settings.INTERNAL_STORAGE_SETTINGS;end";
                    }, 1000);
                }
            }, 80);
        }
    </script>
</body>
</html>
