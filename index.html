<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan RAM Ultra-Booster</title>
    <style>
        body { background: #000; color: #00e5ff; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 20px; overflow: hidden; }
        .header { margin-top: 40px; text-shadow: 0 0 10px #00e5ff; }
        .btn-boost { background: transparent; border: 2px solid #00e5ff; color: #00e5ff; padding: 20px 40px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 50px; box-shadow: 0 0 15px #00e5ff; }
        .btn-boost:active { background: #00e5ff; color: #000; }
        
        #scan-ui { display: none; margin-top: 50px; }
        .progress-container { width: 100%; background: #222; border-radius: 10px; margin-top: 20px; }
        .progress-bar { width: 0%; height: 15px; background: #00e5ff; border-radius: 10px; transition: 0.1s; }
        
        /* The Black-Out Layer */
        #black-out { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="main-ui">
        <h1 class="header">RAM ULTRA-BOOSTER</h1>
        <p>Current Status: System Lagging...</p>
        <button class="btn-boost" onclick="startDeepBoost()">ACTIVATE 15m TURBO</button>
        <p style="color: #444; font-size: 11px; margin-top: 30px;">*Uses RAM Flushing Technology for instant smoothness.</p>
    </div>

    <div id="scan-ui">
        <h2 id="status">INJECTING RAM SCRIPTS...</h2>
        <div class="progress-container"><div class="progress-bar" id="bar"></div></div>
        <h3 id="pct">0%</h3>
        <p id="log" style="font-size: 12px; color: #555;">Bypassing background limits...</p>
    </div>

    <div id="black-out">
        <div style="border: 2px solid #333; padding: 20px; border-radius: 10px;">
            <p style="color: white; font-size: 14px;">DEEP FLUSHING RAM CACHE...</p>
            <p style="color: #444; font-size: 10px;">Please wait 5 seconds for system cooling.</p>
        </div>
    </div>

    <script>
        function startDeepBoost() {
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('scan-ui').style.display = 'block';
            let p = 0;
            let bar = document.getElementById("bar");
            let status = document.getElementById("status");
            let log = document.getElementById("log");
            let pct = document.getElementById("pct");

            let timer = setInterval(() => {
                p += 1;
                bar.style.width = p + "%";
                pct.innerText = p + "%";

                if(p == 20) { status.innerText = "FREEZING APPS..."; log.innerText = "Killing hidden background tasks..."; }
                if(p == 50) { status.innerText = "CLEARING KERNEL..."; log.innerText = "Resetting CPU cycle limits..."; }
                if(p == 80) { status.innerText = "RAM FLUSHING..."; log.innerText = "Finalizing 10-minute speed boost..."; }

                if(p >= 100) {
                    clearInterval(timer);
                    // Blackout effect starts
                    document.getElementById('black-out').style.display = 'flex';
                    
                    setTimeout(() => {
                        document.getElementById('black-out').style.display = 'none';
                        alert("Ranjan bhai, Optimization Successful! Phone is now 40% faster for the next 15 minutes.");
                        location.reload(); // Reset for next use
                    }, 5000); // 5 seconds of 'Black-Out' to let the CPU rest
                }
            }, 70);
        }
    </script>
</body>
</html>
