<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Store | Official & Creator Portal</title>
    <style>
        :root { --primary: #01875f; --dark: #0f172a; --uptodown: #00a0e1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; text-align: center; }
        
        .header { background: #000; padding: 20px; border-bottom: 3px solid var(--primary); }
        .logo { font-size: 28px; font-weight: bold; color: var(--primary); letter-spacing: 1px; }

        .container { padding: 40px 20px; max-width: 600px; margin: auto; }
        #mainSearch {
            width: 100%; padding: 18px 25px; border-radius: 50px;
            border: 2px solid #334155; background: #1e293b; color: white; font-size: 18px; outline: none;
            box-sizing: border-box;
        }
        #mainSearch:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(1, 135, 95, 0.3); }

        /* Normal Search Button */
        #normalSearchArea { margin-top: 25px; display: block; }
        .btn-store {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            background: var(--primary); color: white; font-weight: bold; cursor: pointer;
            font-size: 16px; text-transform: uppercase;
        }

        /* Secret Upload Section (Hidden by Default) */
        #secretUploadArea {
            display: none; 
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px dashed var(--uptodown);
        }
        .upload-icon { width: 80px; cursor: pointer; animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .upload-label { color: var(--uptodown); font-weight: bold; margin-top: 10px; display: block; cursor: pointer; }

        .footer { margin-top: 50px; color: #444; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">X-STORE PRO</div>
</div>

<div class="container">
    <h2>Lakhon Apps Official Store Se</h2>
    <input type="text" id="mainSearch" placeholder="Search any app (Secret code: PRK)..." onkeyup="handleSearchLogic()">
    
    <div id="normalSearchArea">
        <button class="btn-store" onclick="redirectToOfficialStore()">Open in Official Store</button>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">Safe & Secure Deep Linking</p>
    </div>

    <div id="secretUploadArea" onclick="goToUptodown()">
        <img src="https://img.icons8.com/fluency/96/upload-to-cloud.png" class="upload-icon">
        <span class="upload-label">SECRET: PUBLISH TO UPTODOWN</span>
    </div>
</div>

<div class="footer">Verified by X-Store Security Protocol</div>

<script>
    function handleSearchLogic() {
        const query = document.getElementById('mainSearch').value.trim().toUpperCase();
        const normalArea = document.getElementById('normalSearchArea');
        const secretArea = document.getElementById('secretUploadArea');

        if (query === "PRK") {
            // Secret Mode On
            normalArea.style.display = "none";
            secretArea.style.display = "block";
        } else {
            // Normal Mode On
            normalArea.style.display = "block";
            secretArea.style.display = "none";
        }
    }

    function redirectToOfficialStore() {
        const appName = document.getElementById('mainSearch').value.trim();
        if (!appName) { alert("Bhai, app ka naam toh dalo!"); return; }

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        let url = isIOS 
            ? `https://apps.apple.com/search?term=${encodeURIComponent(appName)}` 
            : `https://play.google.com/store/search?q=${encodeURIComponent(appName)}&c=apps`;
        
        window.location.href = url;
    }

    function goToUptodown() {
        window.location.href = "https://developers.uptodown.com/";
    }
</script>

</body>
</html>
