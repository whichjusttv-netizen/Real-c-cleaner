<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280"> <title>Ranjan Stealth Pro</title>
    <style>
        body { width: 1280px; margin: 0; background: #121212; overflow: hidden; }
        .top-bar { padding: 15px; display: flex; background: #1f1f1f; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; background: #333; color: white; }
        button { padding: 10px 25px; background: #00e676; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #output { width: 100%; height: calc(100vh - 70px); border: none; background: white; }
    </style>
</head>
<body>

<div class="top-bar">
    <input type="text" id="targetUrl" placeholder="Bina kisi rukawat ke search karein..." onkeydown="if(event.key==='Enter') unblock()">
    <button onclick="unblock()">OPEN</button>
</div>

<iframe id="output" src="https://www.google.com/search?igu=1"></iframe>

<script>
    function unblock() {
        let val = document.getElementById('targetUrl').value;
        let output = document.getElementById('output');

        if (val.includes('.') && !val.includes(' ')) {
            // PROXY LOGIC: Ye 'allorigins' ka proxy raste mein security headers ko tod deta hai
            let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(val.startsWith('http') ? val : 'https://' + val);
            output.src = proxyUrl;
        } else {
            // GOOGLE DESKTOP SYNC
            output.src = "https://www.google.com/search?q=" + encodeURIComponent(val) + "&igu=1&pws=0";
        }
    }
</script>

</body>
</html>
