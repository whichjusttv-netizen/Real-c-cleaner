<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX GHOST V23</title>
    <style>
        :root { --neon: #ff0055; --bg: #05060f; --card: rgba(18, 20, 29, 0.7); --gold: #ffd700; --safe: #00ff9d; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 10px; text-align: center; overflow: hidden; }
        
        /* 🔒 SECURE LOGIN */
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { background: #12141d; padding: 30px; border: 2px solid var(--neon); border-radius: 25px; width: 80%; box-shadow: 0 0 30px rgba(255,0,85,0.2); }

        #app { display: none; }
        .header { position: sticky; top: 0; background: var(--bg); padding: 5px; z-index: 100; border-bottom: 2px solid #1a1c25; }
        
        #search-bar { width: 90%; padding: 12px; border-radius: 12px; border: 1px solid var(--neon); background: #000; color: #fff; margin: 10px 0; outline: none; box-shadow: inset 0 0 5px var(--neon); }

        .wallet { background: linear-gradient(45deg, #000, #111); padding: 15px; border-radius: 20px; border: 1px solid #333; margin-bottom: 10px; }
        .balance { font-size: 32px; font-weight: bold; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        /* 🚀 GHOST SCROLL (ULTRA SMOOTH) */
        #main-list { display: flex; flex-direction: column; gap: 12px; height: 58vh; overflow-y: auto; scrollbar-width: none; padding-bottom: 80px; }
        #main-list::-webkit-scrollbar { display: none; }

        .card { 
            background: var(--card); border: 1px solid #222; border-radius: 15px; 
            padding: 18px; text-align: left; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .info h3 { color: var(--neon); margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .get-btn { background: var(--safe); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 10px; cursor: pointer; box-shadow: 0 0 10px var(--safe); }

        /* FIXED CREDIT BOX */
        .footer-tool { background: #000; padding: 15px; border-top: 2px solid var(--gold); position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; }
        .code-input { width: 60%; padding: 10px; background: #111; border: 1px solid var(--gold); color: var(--gold); border-radius: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="box">
            <h2 style="color:var(--neon); margin:0; letter-spacing:3px;">RTX GHOST</h2>
            <p style="font-size:10px; color:#555; margin-bottom:15px;">LAG-FREE DATABASE SYSTEM</p>
            <input type="password" id="pk" placeholder="PASSWORD" style="width:85%; padding:15px; border-radius:15px; text-align:center; border:none; background:#000; color:var(--neon); font-weight:bold; font-size:18px;">
            <button onclick="unlock()" style="width:100%; padding:15px; background:var(--neon); border:none; border-radius:15px; font-weight:bold; color:#fff; margin-top:15px;">INITIALIZE</button>
        </div>
    </div>

    <div id="app">
        <div class="header">
            <input type="text" id="search-bar" placeholder="Search 1000+ Apps..." onkeyup="filterApps()">
            <div class="wallet">
                <div class="balance" id="coin-txt">0000 CR</div>
            </div>
        </div>

        <div id="main-list">
            </div>

        <div class="footer-tool">
            <input type="text" id="secret-inp" class="code-input" placeholder="Enter 'pkg' for Credits">
            <button onclick="claimSecret()" style="background:var(--gold); color:#000; border:none; padding:10px 15px; border-radius:10px; font-weight:bold; margin-left:5px;">CLAIM</button>
        </div>
    </div>

<script>
    let sc = parseInt(localStorage.getItem('user_sc')) || 0;
    let allApps = [];

    // DATA GENERATOR
    function initData() {
        const providers = ["rexdl.com", "apkmody.io", "happymod.com", "an1.com"];
        const apps = ["Netflix 4K", "Gemini AI", "Minecraft Pro", "GTA VI", "Premiere Elite", "Spotify Gold", "Canva Pro", "PicsArt Pro", "Truecaller Gold", "ExpressVPN"];
        
        allApps = [];
        for(let i = 1; i <= 1000; i++) {
            let base = apps[i % apps.length];
            let site = providers[i % providers.length];
            allApps.push({
                n: `${base} Premium #${i}`,
                s: `https://www.google.com/search?q=site:${site}+${encodeURIComponent(base)}+premium`
            });
        }
    }

    // GHOST RENDERING (No Hang)
    function renderApps(list) {
        const grid = document.getElementById('main-list');
        let html = "";
        // Sirf 30 apps dikhayega taaki phone par load na pade
        let limit = Math.min(list.length, 30);
        for(let i = 0; i < limit; i++) {
            html += `<div class="card">
                <div class="info"><h3>${list[i].n}</h3></div>
                <button class="get-btn" onclick="openChrome('${list[i].s}')">CHROME</button>
            </div>`;
        }
        grid.innerHTML = html;
    }

    function filterApps() {
        let q = document.getElementById('search-bar').value.toLowerCase();
        let filtered = allApps.filter(a => a.n.toLowerCase().includes(q));
        renderApps(filtered);
    }

    function unlock() {
        if(document.getElementById('pk').value === "RTX") {
            document.getElementById('gate').style.display='none';
            document.getElementById('app').style.display='block';
            initData();
            renderApps(allApps);
            updateUI();
        } else { alert("WRONG PASSWORD!"); }
    }

    // 💰 FIXED PKG SYSTEM
    function claimSecret() {
        let val = document.getElementById('secret-inp').value.trim().toLowerCase();
        if(val === "pkg") {
            sc += 1000;
            updateUI();
            alert("1000 Credits Added Successfully!");
            document.getElementById('secret-inp').value = "";
        } else {
            alert("Wrong Code!");
        }
    }

    function openChrome(url) {
        if(sc >= 500) {
            sc -= 500;
            updateUI();
            window.open(url, '_blank');
        } else {
            alert("Insufficient Credits! Use 'pkg' code.");
        }
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = sc.toString().padStart(4,'0') + " CR";
        localStorage.setItem('user_sc', sc);
    }
</script>
</body>
</html>
