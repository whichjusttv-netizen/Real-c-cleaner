<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supreme Engine V2 - Fixed</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #111; padding: 10px; border-bottom: 2px solid red; text-align: center; font-weight: bold; }
        
        /* Layout for Mobile */
        #editor-container { flex: 1; display: flex; flex-direction: column; padding: 10px; }
        textarea { flex: 1; background: #050505; color: #0f0; border: 1px solid #333; padding: 10px; font-size: 14px; border-radius: 5px; }
        
        #game-preview { height: 300px; background: #222; position: relative; overflow: hidden; border-top: 2px solid red; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .status-bar { background: #111; font-size: 12px; padding: 5px; color: #888; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="header">SUPREME ENGINE V2.0 (STABLE)</div>

<div id="game-preview">
    <canvas id="screen"></canvas>
</div>

<div class="status-bar">
    <span>Dev: Ranjan Boss</span>
    <span id="fps">FPS: 60</span>
</div>

<div id="editor-container">
    <label>Live Script (JS):</label>
    <textarea id="code" spellcheck="false">
// AUTO-RUNNING LIVE CODE
// Use 'obj' to move the square
obj.x += 2;
obj.size = 50;

if(obj.x > canvas.width) obj.x = -obj.size;
    </textarea>
</div>

<script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const codeArea = document.getElementById('code');
    const fpsDisplay = document.getElementById('fps');

    let obj = { x: 0, y: 100, size: 50, color: 'red' };
    
    function resize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    window.onresize = resize;
    resize();

    // Smooth Game Loop
    function update() {
        // Clear screen with a slight trail effect
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Object
        ctx.fillStyle = obj.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = obj.color;
        ctx.fillRect(obj.x, obj.y, obj.size, obj.size);
        ctx.shadowBlur = 0;

        // Try to run the user's code smoothly
        try {
            eval(codeArea.value);
        } catch (e) {
            // Silence errors to keep engine running
        }

        requestAnimationFrame(update);
    }

    update(); // Start the engine
</script>

</body>
</html>
