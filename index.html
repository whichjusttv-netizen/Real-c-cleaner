<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-PRO ULTIMATE BRIDGE</title>
    <script src="https://cdn.jsdelivr.net/npm/unity-ads-sdk@4.0.0/dist/unity-ads.min.js"></script>
    <style>
        :root { --neon: #00ff9d; --bg: #05060f; --card: #12141d; --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 15px; text-align: center; }
        
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--card); padding: 30px; border: 2px solid var(--neon); border-radius: 20px; width: 85%; }
        
        #main { display: none; }
        .wallet { background: #000; padding: 20px; border-radius: 20px; border: 1px solid #333; margin: 15px 0; }
        .balance { font-size: 40px; font-weight: bold; color: var(--gold); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .t-btn { padding: 18px 5px; border-radius: 12px; border: none; font-weight: bold; font-size: 11px; cursor: pointer; }
        .u-btn { background: var(--neon); color: #000; }
        .y-btn { background: #ff0000; color: #fff; }

        .store { background: var(--card); border-radius: 15px; padding: 15px; text-align: left; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
        .chrome-btn { background: #0084ff; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 10px; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="box">
            <h2 style="color:var(--neon)">X-SYSTEM</h2>
            <input type="password" id="pass" placeholder="Aarti X" style="width:90%; padding:10px; margin:15px 0; text-align:center; border-radius:8px; border:none;">
            <button onclick="unlock()" style="width:100%; padding:12px; background:var(--neon); border:none; border-radius:10px; font-weight:bold;">ENTER SYSTEM</button>
        </div>
    </div>

    <div id="main">
        <div style="font-size:10px; display:flex; justify-content:space-between; color:#555;">
            <span id="u-stat">UNITY: SCANNING...</span>
            <span>ID: 6096974</span>
        </div>

        <div class="wallet">
            <div style="font-size:10px; color:#888;">CREDITS</div>
            <div class="balance" id="coin-txt">0000</div>
        </div>

        <div class="btn-grid">
            <button class="t-btn u-btn" onclick="showAd()">⚡ UNITY AD<br>+50 Cr</button>
            <button class="t-btn y-btn" onclick="openYT()">📺 YT TASK<br>+50 Cr</button>
        </div>

        <div class="store">
            <p style="color:var(--gold); font-weight:bold; font-size:12px; margin-top:0;">CHROME EXTERNAL STORE (500 Cr)</p>
            <div class="item"><span>GB WhatsApp Pro</span> <button class="chrome-btn" onclick="goLink('https://androidwaves.com/download-gbwhatsapp-pro-apk/')">GET LINK</button></div>
            <div class="item"><span>FF Headshot Mod</span> <button class="chrome-btn" onclick="goLink('https://www.google.com/search?q=free+fire+mod+apk')">GET LINK</button></div>
            <div class="item"><span>Instagram Pro</span> <button class="chrome-btn" onclick="goLink('https://instamod.net/')">GET LINK</button></div>
        </div>
    </div>

<script>
    let sc = parseInt(localStorage.getItem('user_sc')) || 0;
    let uReady = false;

    function unlock() {
        if(document.getElementById('pass').value === "Aarti X") {
            document.getElementById('gate').style.display='none';
            document.getElementById('main').style.display='block';
            initU(); update();
        } else { alert("Wrong Password!"); }
    }

    function initU() {
        UnityAds.initialize("6096974", false, (s) => {
            if(s) { uReady=true; document.getElementById('u-stat').innerText="UNITY: ONLINE"; document.getElementById('u-stat').style.color="#00ff9d"; }
            else { setTimeout(initU, 3000); }
        });
    }

    function showAd() {
        if(uReady) { UnityAds.show('Rewarded_Android'); setTimeout(()=>{ sc+=50; update(); }, 5000); }
        else { alert("Unity connecting..."); initU(); }
    }

    function openYT() { window.open('https://youtube.com', '_blank'); setTimeout(()=>{ sc+=50; update(); }, 8000); }

    // --- CHROME REDIRECT FIX (NO MORE ERR_HTTP ERROR) ---
    function goLink(url) {
        if(sc >= 500) {
            let c = confirm("WARNING: This link will open in CHROME. X-PRO will close the bridge now. Do you want to proceed?");
            if(c) {
                sc -= 500;
                update();
                
                // Ye command seedha Chrome ko trigger karega
                var win = window.open(url, '_system'); // '_system' phone browser ke liye hota hai
                if(!win) {
                    window.location.assign(url); // Backup method
                }
                alert("Redirecting... Check your Browser!");
            }
        } else { alert("500 Coins chahiye bhai!"); }
    }

    function update() {
        document.getElementById('coin-txt').innerText = sc.toString().padStart(4, '0');
        localStorage.setItem('user_sc', sc);
    }
</script>
</body>
</html>
