<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --google-gray: #f2f2f2; --blue-link: #1a0dab; --desc-gray: #4d5156; }
        body { margin: 0; font-family: arial, sans-serif; background: #fff; }
        
        /* 🔍 ASLI GOOGLE LOOK HEADER */
        .search-top { padding: 15px; border-bottom: 1px solid #ebebeb; display: flex; align-items: center; position: sticky; top: 0; background: #fff; }
        .g-logo { font-size: 20px; font-weight: bold; margin-right: 15px; }
        .s-box { flex: 1; background: #fff; border: 1px solid #dfe1e5; border-radius: 24px; padding: 8px 15px; box-shadow: 0 1px 6px rgba(32,33,36,0.28); font-size: 14px; }

        /* RESULT STYLING */
        .results-container { padding: 10px 15px; }
        .g-item { margin-bottom: 25px; }
        .g-site { font-size: 12px; color: #202124; display: flex; align-items: center; margin-bottom: 4px; }
        .g-site img { width: 16px; margin-right: 8px; border-radius: 50%; }
        .g-title { font-size: 18px; color: var(--blue-link); text-decoration: none; display: block; margin-bottom: 3px; }
        .g-desc { font-size: 13px; color: var(--desc-gray); line-height: 1.5; }
        
        /* DIRECT LINK BOX (For Verified Apps) */
        #direct-box { display:none; padding: 20px; text-align: center; background: #f8f9fa; border: 1px solid #ddd; border-radius: 10px; margin: 20px; }
        .dl-btn { background: #000; color: #fff; padding: 15px 30px; border-radius: 5px; text-decoration: none; display: inline-block; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="main-logic">
        <div id="google-ui" style="display:none;">
            <div class="search-top">
                <div class="g-logo">
                    <span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span>
                </div>
                <div class="s-box" id="query-display">spotify premium</div>
            </div>
            
            <div class="results-container" id="res-list">
                </div>
        </div>

        <div id="direct-box">
            <h3 id="app-n">Software Found</h3>
            <p style="font-size:12px; color:gray;">Verified by RTX Bharat Team</p>
            <a href="#" id="app-l" class="dl-btn">DOWNLOAD NOW</a>
        </div>
    </div>

    <script>
        // Data logic
        const database = {
            "spotify": { type: "search", query: "Spotify Premium Mod 2026", results: [
                { site: "spotify.com", title: "Spotify Premium - Get 3 Months Free", desc: "Enjoy ad-free music, offline playback, and unlimited skips. Offer available for students and individuals." },
                { site: "softonic.com", title: "Download Spotify Premium (Premium) - Softonic", desc: "Unlock all VIP features, no ads, high quality audio. Safe and verified download." }
            ]},
            "sigma": { type: "direct", name: "Sigma Battle Royale", url: "https://sigma-battle.en.softonic.com/android/download" }
        };

        function route(input) {
            const data = database[input.toLowerCase()];
            if (!data) return;

            if (data.type === "direct") {
                document.getElementById('google-ui').style.display = 'none';
                document.getElementById('direct-box').style.display = 'block';
                document.getElementById('app-n').innerText = data.name;
                document.getElementById('app-l').href = data.url;
            } else {
                document.getElementById('direct-box').style.display = 'none';
                document.getElementById('google-ui').style.display = 'block';
                document.getElementById('query-display').innerText = data.query;
                
                let html = "";
                data.results.forEach(r => {
                    html += `
                    <div class="g-item">
                        <div class="g-site"><span>https://www.${r.site}</span></div>
                        <a href="https://${r.site}" class="g-title">${r.title}</a>
                        <div class="g-desc">${r.desc}</div>
                    </div>`;
                });
                document.getElementById('res-list').innerHTML = html;
            }
        }

        // Example trigger: Jab app khule
        window.onload = () => route("spotify"); // Change to "sigma" for direct link test
    </script>
</body>
</html>
