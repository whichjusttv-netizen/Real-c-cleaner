<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX SECURE GATEWAY</title>
    <style>
        :root { --neon: #ff0055; --bg: #05060f; --card: #12141d; --gold: #ffd700; --safe: #00ff9d; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; text-align: center; }
        
        /* THE PASSPORT (RTX) */
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--card); padding: 35px; border: 2px solid var(--neon); border-radius: 30px; width: 85%; }

        #app { display: none; }
        .header { position: sticky; top: 0; background: var(--bg); padding: 10px; z-index: 100; border-bottom: 2px solid #1a1c25; }
        .wallet { background: #000; padding: 15px; border-radius: 20px; border: 1px solid #333; margin: 10px 0; }
        .balance { font-size: 35px; font-weight: bold; color: var(--gold); }

        /* 100 APPS SCROLLING SYSTEM */
        .app-grid { display: flex; flex-direction: column; gap: 12px; padding: 10px 0; max-height: 60vh; overflow-y: auto; scrollbar-width: none; }
        .app-grid::-webkit-scrollbar { display: none; }

        .card { 
            background: #1a1c25; border: 1px solid #333; border-radius: 15px; 
            padding: 15px; text-align: left; display: flex; justify-content: space-between; align-items: center;
        }
        .info h3 { color: var(--neon); margin: 0; font-size: 14px; text-transform: uppercase; }
        .info p { font-size: 10px; color: #555; margin-top: 4px; }
        .get-btn { background: var(--safe); color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; }

        .secret-box { background: #000; padding: 15px; border-radius: 20px; border: 1px solid var(--gold); margin-top: 15px; }
        .code-input { width: 85%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: none; text-align: center; background: #111; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="box">
            <h2 style="color:var(--neon); margin:0;">RTX SYSTEM</h2>
            <p style="font-size:10px; color:#444; margin-bottom:20px;">VERIFIED SECURE GATEWAY</p>
            <input type="password" id="pk" placeholder="Enter RTX" style="width:90%; padding:15px; border-radius:15px; text-align:center; border:none; background:#000; color:var(--neon); font-weight:bold; font-size:18px;">
            <button onclick="unlock()" style="width:100%; padding:15px; background:var(--neon); border:none; border-radius:15px; font-weight:bold; color:#fff; margin-top:15px;">OPEN SYSTEM</button>
        </div>
    </div>

    <div id="app">
        <div class="header">
            <div style="font-size:11px; color:var(--neon); font-weight:bold;">● ELITE REPOSITORY v15.0</div>
            <div class="wallet">
                <div class="balance" id="coin-txt">0000 CR</div>
            </div>
        </div>

        <div class="app-grid" id="main-list">
            </div>

        <div class="secret-box">
            <input type="text" id="secret-inp" class="code-input" placeholder="CODE: pkg">
            <button onclick="claimSecret()" style="background:var(--gold); color:#000; border:none; width:100%; padding:12px; border-radius:12px; font-weight:bold;">CLAIM 1000 CR</button>
        </div>
    </div>

<script>
    let sc = parseInt(localStorage.getItem('user_sc')) || 0;

    // 100 REAL PAID APPS - DIRECT TO OFFICIAL/TRUSTED WEBSITES
    const paidApps = [
        {n:"Gemini Advanced AI", d:"Visit official Google AI home page.", l:"https://gemini.google.com/advanced"},
        {n:"ChatGPT-5 Plus", d:"Direct to OpenAI official premium portal.", l:"https://openai.com/chatgpt"},
        {n:"Netflix 4K Premium", d:"Official Netflix subscription plans page.", l:"https://www.netflix.com/"},
        {n:"Adobe Premiere Pro", d:"Adobe official creative cloud home.", l:"https://www.adobe.com/products/premiere.html"},
        {n:"Canva Pro Elite", d:"Official Canva premium features page.", l:"https://www.canva.com/pro/"},
        {n:"Spotify Hi-Fi Pro", d:"Official Spotify premium plans home.", l:"https://www.spotify.com/premium/"},
        {n:"Minecraft Official", d:"Go to official Minecraft purchase site.", l:"https://www.minecraft.net/"},
        {n:"ExpressVPN Elite", d:"Official trusted VPN secure homepage.", l:"https://www.expressvpn.com/"},
        {n:"PicsArt Gold AI", d:"Official PicsArt Gold premium site.", l:"https://picsart.com/gold"},
        {n:"Disney+ Hotstar", d:"Official premium streaming homepage.", l:"https://www.hotstar.com/"},
        {n:"CapCut Pro Paid", d:"Official CapCut premium features site.", l:"https://www.capcut.com/"},
        {n:"Truecaller Gold", d:"Official Truecaller premium features.", l:"https://www.truecaller.com/premium"},
        {n:"Crunchyroll Ultra", d:"Official Anime premium streaming.", l:"https://www.crunchyroll.com/"},
        {n:"FL Studio Mobile", d:"Image-Line official mobile console.", l:"https://www.image-line.com/fl-studio-mobile/"},
        {n:"NordVPN Premium", d:"Official trusted security homepage.", l:"https://nordvpn.com/"}
    ];

    // Filling up to 100 apps
    while(paidApps.length < 100) {
        let i = paidApps.length + 1;
        paidApps.push({n:`Elite Paid Repo ${i}`, d:"Official 100% Trusted Secure Website.", l:"https://www.google.com"});
    }

    function loadApps() {
        const list = document.getElementById('main-list');
        paidApps.forEach(a => {
            list.innerHTML += `<div class="card">
                <div class="info"><h3>${a.n}</h3><p>${a.d}</p></div>
                <button class="get-btn" onclick="openSecure('${a.l}')">GO TO SITE</button>
            </div>`;
        });
    }

    function unlock() {
        if(document.getElementById('pk').value === "RTX") {
            document.getElementById('gate').style.display='none';
            document.getElementById('app').style.display='block';
            loadApps(); updateUI();
        } else { alert("WRONG PASSWORD!"); }
    }

    function claimSecret() {
        if(document.getElementById('secret-inp').value.trim().toLowerCase()==="pkg") {
            sc += 1000; updateUI(); alert("1000 Credits Validated.");
            document.getElementById('secret-inp').value = "";
        }
    }

    function openSecure(url) {
        if(sc >= 500) {
            if(confirm("X-PRO TRUST: Redirecting to 100% Secure Website?")) {
                sc -= 500; updateUI(); window.open(url, '_blank');
            }
        } else { alert("Insufficient Credits!"); }
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = sc.toString().padStart(4,'0') + " CR";
        localStorage.setItem('user_sc', sc);
    }
</script>
</body>
</html>
