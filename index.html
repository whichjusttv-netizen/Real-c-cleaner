<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Store | Official Redirect</title>
    <style>
        :root { --play-green: #01875f; --apple-blue: #0071e3; --dark: #121212; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--dark); color: white; margin: 0; text-align: center; }
        
        .nav { background: #000; padding: 20px; border-bottom: 3px solid var(--play-green); }
        .logo { font-size: 28px; font-weight: bold; color: var(--play-green); text-transform: uppercase; }

        .search-section { padding: 40px 20px; }
        #appInput {
            width: 80%; max-width: 500px; padding: 15px 25px; border-radius: 30px;
            border: none; font-size: 18px; outline: 2px solid #333; background: #222; color: white;
        }
        #appInput:focus { outline: 2px solid var(--play-green); }

        .btn-search {
            margin-top: 20px; padding: 12px 40px; border-radius: 30px; border: none;
            background: var(--play-green); color: white; font-weight: bold; cursor: pointer;
            font-size: 16px; transition: 0.3s;
        }
        .btn-search:hover { background: #01a373; transform: translateY(-3px); }

        .info-box { margin-top: 50px; padding: 20px; color: #888; font-size: 14px; }
        .store-icon { width: 30px; vertical-align: middle; margin: 0 10px; }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo">X-Store Pro</div>
</div>

<div class="search-section">
    <h2>Search Any App to Open in Store</h2>
    <input type="text" id="appInput" placeholder="Enter App Name (e.g. Instagram, BGMI, WhatsApp)...">
    <br>
    <button class="btn-search" onclick="redirectToStore()">OPEN IN PLAY STORE</button>
</div>

<div class="info-box">
    <p>Supports: 
        <img src="https://img.icons8.com/color/48/google-play.png" class="store-icon"> Play Store 
        <img src="https://img.icons8.com/color/48/apple-app-store--v1.png" class="store-icon"> App Store
    </p>
    <p>100% Official & Secure Connection</p>
</div>

<script>
    function redirectToStore() {
        const appName = document.getElementById('appInput').value;
        if (!appName) {
            alert("Bhai, pehle app ka naam to likho!");
            return;
        }

        // Device Detection Logic
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        let storeUrl;

        if (isIOS) {
            // iPhone ke liye App Store search link
            storeUrl = `https://apps.apple.com/search?term=${encodeURIComponent(appName)}`;
        } else {
            // Android ke liye Play Store search link
            // Ye seedha Play Store app ko trigger karega
            storeUrl = `https://play.google.com/store/search?q=${encodeURIComponent(appName)}&c=apps`;
        }

        // Direct Redirect
        window.location.href = storeUrl;
    }
</script>

</body>
</html>
