<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX PREDATOR v24</title>
    <style>
        :root { --neon: #00ff9d; --danger: #ff0055; --bg: #020205; --card: rgba(20, 20, 30, 0.8); --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 10px; overflow: hidden; }
        
        /* 🔒 HACKER LOGIN */
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { background: #0a0a0f; padding: 30px; border: 1px solid var(--neon); border-radius: 5px; width: 85%; box-shadow: 0 0 20px var(--neon); text-align: center; }

        #app { display: none; }
        
        /* 🧪 DECODING OVERLAY */
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; color: var(--neon); }
        .matrix-text { font-size: 14px; margin: 5px; }

        /* 🔍 SEARCH & HEADER */
        .header { position: sticky; top: 0; background: var(--bg); z-index: 100; border-bottom: 1px solid #333; padding-bottom: 10px; }
        #search-bar { width: 92%; padding: 12px; background: #000; border: 1px solid var(--neon); color: var(--neon); border-radius: 5px; outline: none; margin: 10px 0; }

        .wallet { border: 1px solid var(--gold); padding: 10px; border-radius: 5px; display: inline-block; margin-bottom: 10px; }
        .balance { font-size: 24px; color: var(--gold); font-weight: bold; }

        /* 🗄️ REINFORCED DATABASE LIST */
        #main-list { height: 60vh; overflow-y: auto; scrollbar-width: none; padding-bottom: 100px; }
        #main-list::-webkit-scrollbar { display: none; }

        .card { 
            background: var(--card); border-left: 4px solid var(--danger); margin: 10px 0;
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
            backdrop-filter: blur(5px);
        }
        .card h3 { margin: 0; font-size: 14px; color: #fff; letter-spacing: 1px; }
        
        /* MULTI-SERVER BUTTONS */
        .server-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .srv-btn { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .srv-btn:active { background: var(--neon); color: #000; }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 15px; border-top: 1px solid var(--neon); display: flex; justify-content: space-around; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="matrix-text" id="load-msg">INITIALIZING BYPASS...</div>
        <div style="width: 200px; height: 2px; background: #222; margin-top: 10px;">
            <div id="progress" style="width: 0%; height: 100%; background: var(--neon);"></div>
        </div>
    </div>

    <div id="gate">
        <div class="box">
            <h2 style="color:var(--neon); margin:0;">SYSTEM AUTH</h2>
            <p style="font-size:10px; color:#555;">v24.0 PREDATOR CORE</p>
            <input type="password" id="pk" placeholder="ENTER RTX" style="width:80%; padding:12px; background:#000; border:1px solid #333; color:var(--neon); margin-top:20px; text-align:center;">
            <button onclick="unlock()" style="width:85%; padding:12px; background:var(--neon); color:#000; border:none; margin-top:15px; font-weight:bold;">INITIALIZE ACCESS</button>
        </div>
    </div>

    <div id="app">
        <div class="header">
            <input type="text" id="search-bar" placeholder="KHOJO: 1000+ PREMIUM SOURCES" onkeyup="filterApps()">
            <div class="wallet">
                <span style="font-size:10px;">CREDITS:</span> <span class="balance" id="coin-txt">0000</span>
            </div>
        </div>

        <div id="main-list"></div>

        <div class="footer">
            <input type="text" id="secret-inp" placeholder="CODE" style="width:50%; background:#111; border:1px solid var(--gold); color:var(--gold); padding:5px; text-align:center;">
            <button onclick="claimSecret()" style="background:var(--gold); color:#000; border:none; padding:5px 15px; font-weight:bold;">+1000</button>
        </div>
    </div>

<script>
    let sc = parseInt(localStorage.getItem('user_sc')) || 0;
    let database = [];

    // 🏗️ REINFORCED DATABASE SYSTEM (1000 APPS)
    function buildDatabase() {
        const apps = ["Gemini AI", "Netflix 4K", "Minecraft", "GTA 6", "ChatGPT-5", "Premiere Pro", "Spotify Gold", "Canva Pro", "ExpressVPN", "PicsArt Pro"];
        const mirrors = ["rexdl.com", "apkmody.io", "happymod.com", "an1.com"];
        
        database = [];
        for(let i = 1; i <= 1000; i++) {
            let name = apps[i % apps.length];
            database.push({
                n: `${name} Premium #${i}`,
                s1: `https://www.google.com/search?q=site:${mirrors[0]}+${name}+premium`,
                s2: `https://www.google.com/search?q=site:${mirrors[1]}+${name}+premium`
            });
        }
    }

    function render(list) {
        const container = document.getElementById('main-list');
        let html = "";
        let limit = Math.min(list.length, 40); // Memory safe limit
        for(let i = 0; i < limit; i++) {
            html += `<div class="card">
                <h3>${list[i].n}</h3>
                <div class="server-grid">
                    <button class="srv-btn" onclick="triggerDecode('${list[i].s1}')">SERVER 1 (FAST)</button>
                    <button class="srv-btn" onclick="triggerDecode('${list[i].s2}')">SERVER 2 (SECURE)</button>
                </div>
            </div>`;
        }
        container.innerHTML = html;
    }

    // 🧪 DECODING ANIMATION LOGIC
    function triggerDecode(url) {
        if(sc < 500) { alert("Credits Low!"); return; }
        
        const loader = document.getElementById('loader');
        const msg = document.getElementById('load-msg');
        const prog = document.getElementById('progress');
        
        loader.style.display = 'flex';
        let p = 0;
        let steps = ["BYPASSING PAYWALL...", "DECRYPTING SOURCE...", "INJECTING SCRIPT...", "OPENING CHROME..."];
        
        let interval = setInterval(() => {
            p += 5;
            prog.style.width = p + "%";
            msg.innerText = steps[Math.floor(p/30)] || "REDIRECTING...";
            
            if(p >= 100) {
                clearInterval(interval);
                loader.style.display = 'none';
                sc -= 500;
                updateUI();
                window.open(url, '_blank');
            }
        }, 100);
    }

    function filterApps() {
        let q = document.getElementById('search-bar').value.toLowerCase();
        let filtered = database.filter(a => a.n.toLowerCase().includes(q));
        render(filtered);
    }

    function unlock() {
        if(document.getElementById('pk').value === "RTX") {
            document.getElementById('gate').style.display='none';
            document.getElementById('app').style.display='block';
            buildDatabase();
            render(database);
            updateUI();
        } else { alert("ACCESS DENIED"); }
    }

    function claimSecret() {
        if(document.getElementById('secret-inp').value.toLowerCase() === "pkg") {
            sc += 1000; updateUI(); alert("CREDITS INJECTED");
        }
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = sc.toString().padStart(4,'0');
        localStorage.setItem('user_sc', sc);
    }
</script>
</body>
</html>
