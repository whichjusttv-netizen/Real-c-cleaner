<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Store | Global App Portal</title>
    <style>
        :root { --primary: #01875f; --dark: #0f172a; --accent: #00a0e1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark); color: #ffffff; margin: 0; text-align: center; }
        
        /* Header Section */
        .navbar { background: #000000; padding: 25px; border-bottom: 3px solid var(--primary); }
        .brand { font-size: 32px; font-weight: 900; color: var(--primary); letter-spacing: 1px; }

        .main-content { padding: 45px 20px; max-width: 650px; margin: auto; }
        #appSearchBar {
            width: 100%; padding: 20px 25px; border-radius: 50px;
            border: 2px solid #334155; background: #1e293b; color: #ffffff; font-size: 18px; outline: none;
            box-sizing: border-box; transition: 0.3s;
        }
        #appSearchBar:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(1, 135, 95, 0.4); }

        /* Store Access Button */
        #storeAccessArea { margin-top: 30px; display: block; }
        .btn-launch {
            width: 100%; padding: 18px; border-radius: 50px; border: none;
            background: var(--primary); color: #ffffff; font-weight: bold; cursor: pointer;
            font-size: 18px; text-transform: uppercase; transition: 0.3s;
        }
        .btn-launch:hover { background: #01a373; transform: translateY(-2px); }

        /* Secret Publisher Panel */
        #secretPublisherPanel {
            display: none; 
            margin-top: 35px;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 25px;
            border: 2px dashed var(--accent);
            cursor: pointer;
        }
        .cloud-icon { width: 100px; animation: hoverPulse 2s infinite; }
        @keyframes hoverPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .panel-title { color: var(--accent); font-weight: 800; font-size: 20px; margin-top: 15px; display: block; }

        .app-footer { margin-top: 60px; color: #475569; font-size: 13px; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">X-STORE PRO</div>
</div>

<div class="main-content">
    <h2 style="font-weight: 500; color: #cbd5e1;">Global Digital Repository</h2>
    <input type="text" id="appSearchBar" placeholder="Search millions of apps..." onkeyup="syncAppLogic()">
    
    <div id="storeAccessArea">
        <button class="btn-launch" onclick="launchOfficialStore()">Open Official Store</button>
        <p style="font-size: 12px; color: #64748b; margin-top: 12px;">Secure Connection Verified</p>
    </div>

    <div id="secretPublisherPanel" onclick="openPublisherPortal()">
        <img src="https://img.icons8.com/fluency/144/cloud-lighting.png" class="cloud-icon">
        <span class="panel-title">PUBLISHER DASHBOARD</span>
        <p style="color: #94a3b8; font-size: 14px;">Upload & Distribute Your Content</p>
    </div>
</div>

<div class="app-footer">ENCRYPTED GATEWAY | POWERED BY X-CORE</div>

<script>
    function syncAppLogic() {
        const inputVal = document.getElementById('appSearchBar').value.trim().toUpperCase();
        const standardUI = document.getElementById('storeAccessArea');
        const secretUI = document.getElementById('secretPublisherPanel');

        // Secret Trigger: PRK
        if (inputVal === "PRK") {
            standardUI.style.display = "none";
            secretUI.style.display = "block";
        } else {
            standardUI.style.display = "block";
            secretUI.style.display = "none";
        }
    }

    function launchOfficialStore() {
        const query = document.getElementById('appSearchBar').value.trim();
        if (!query) { alert("Please enter an application name."); return; }

        const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent);
        let storeLink = isApple 
            ? `https://apps.apple.com/search?term=${encodeURIComponent(query)}` 
            : `https://play.google.com/store/search?q=${encodeURIComponent(query)}&c=apps`;
        
        window.location.href = storeLink;
    }

    function openPublisherPortal() {
        // Updated stable link to prevent "Name Not Resolved" error
        window.location.href = "https://en.uptodown.com/publish";
    }
</script>

</body>
</html>
