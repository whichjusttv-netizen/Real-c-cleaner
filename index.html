<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX ANTI-LAG ENGINE</title>
    <style>
        :root { --neon: #ff0055; --bg: #05060f; --card: #12141d; --gold: #ffd700; --safe: #00ff9d; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; text-align: center; overflow: hidden; }
        
        /* 🔒 SECURE LOGIN */
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--card); padding: 30px; border: 2px solid var(--neon); border-radius: 25px; width: 80%; box-shadow: 0 0 20px var(--neon); }

        #app { display: none; }
        .header { position: sticky; top: 0; background: var(--bg); padding: 5px; z-index: 100; border-bottom: 2px solid #1a1c25; }
        
        /* 🔍 FAST SEARCH */
        #search-bar { width: 90%; padding: 12px; border-radius: 12px; border: 1px solid var(--neon); background: #000; color: #fff; margin: 10px 0; outline: none; }

        .wallet { background: #000; padding: 10px; border-radius: 15px; border: 1px solid #333; margin-bottom: 10px; }
        .balance { font-size: 28px; font-weight: bold; color: var(--gold); }

        /* 🚀 OPTIMIZED SCROLL (NO HANG) */
        #main-list { display: flex; flex-direction: column; gap: 10px; height: 60vh; overflow-y: auto; scrollbar-width: none; padding-bottom: 50px; }
        #main-list::-webkit-scrollbar { display: none; }

        .card { 
            background: #1a1c25; border: 1px solid #222; border-radius: 12px; 
            padding: 15px; text-align: left; display: flex; justify-content: space-between; align-items: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .info h3 { color: var(--neon); margin: 0; font-size: 13px; text-transform: uppercase; }
        .get-btn { background: var(--safe); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer; }

        .footer-tool { background: #000; padding: 15px; border-radius: 20px; border: 1px solid var(--gold); position: fixed; bottom: 10px; left: 10px; right: 10px; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="box">
            <h2 style="color:var(--neon); margin:0;">RTX V22</h2>
            <p style="font-size:10px; color:#444; margin-bottom:15px;">FIXED LAG & DATABASE ENGINE</p>
            <input type="password" id="pk" placeholder="Password: RTX" style="width:85%; padding:12px; border-radius:10px; text-align:center; border:none; background:#000; color:var(--neon); font-weight:bold;">
            <button onclick="unlock()" style="width:100%; padding:12px; background:var(--neon); border:none; border-radius:10px; font-weight:bold; color:#fff; margin-top:10px;">FIX & OPEN</button>
        </div>
    </div>

    <div id="app">
        <div class="header">
            <input type="text" id="search-bar" placeholder="Search 1000+ Premium Apps..." onkeyup="filterApps()">
            <div class="wallet">
                <div class="balance" id="coin-txt">0000 CR</div>
            </div>
        </div>

        <div id="main-list">
            </div>

        <div class="footer-tool">
            <input type="text" id="secret-inp" placeholder="Code: pkg" style="width:60%; padding:8px; background:#111; border:none; color:var(--gold); border-radius:5px; text-align:center;">
            <button onclick="claimSecret()" style="background:var(--gold); color:#000; border:none; padding:8px 15px; border-radius:5px; font-weight:bold;">+1000</button>
        </div>
    </div>

<script>
    let sc = parseInt(localStorage.getItem('user_sc')) || 0;
    let allApps = [];

    // 🔥 SMART DATA ENGINE (No Hang Logic)
    const sources = ["rexdl.com", "apkmody.io", "happymod.com", "an1.com", "apkdone.com"];
    const names = ["Netflix 4K", "Gemini AI", "Minecraft", "GTA 2026", "Premiere Pro", "Spotify HiFi", "Canva Pro", "PicsArt Pro", "Truecaller Gold", "ExpressVPN"];

    function initData() {
        allApps = [];
        for(let i = 1; i <= 1000; i++) {
            let base = names[i % names.length];
            let provider = sources[i % sources.length];
            allApps.push({
                n: `${base} Premium #${i}`,
                s: `https://www.google.com/search?q=site:${provider}+${encodeURIComponent(base)}+premium`
            });
        }
    }

    function renderApps(list) {
        const grid = document.getElementById('main-list');
        // Sirf top 30 apps dikhayega pehle (Performance fix)
        let html = "";
        let limit = list.length > 50 ? 50 : list.length; 
        
        for(let i = 0; i < limit; i++) {
            html += `<div class="card">
                <div class="info"><h3>${list[i].n}</h3></div>
                <button class="get-btn" onclick="openChrome('${list[i].s}')">CHROME</button>
            </div>`;
        }
        grid.innerHTML = html;
        grid.scrollTop = 0;
    }

    function filterApps() {
        let q = document.getElementById('search-bar').value.toLowerCase();
        let filtered = allApps.filter(a => a.n.toLowerCase().includes(q));
        renderApps(filtered);
    }

    function unlock() {
        if(document.getElementById('pk').value === "RTX") {
            document.getElementById('gate').style.display='none';
            document.getElementById('app').style.display='block';
            initData();
            renderApps(allApps);
            updateUI();
        } else { alert("ACCESS DENIED"); }
    }

    function claimSecret() {
        if(document.getElementById('secret-inp').value.toLowerCase()==="pkg") {
            sc += 1000; updateUI(); alert("Credits Injected!");
        }
    }

    function openChrome(url) {
        if(sc >= 500) {
            sc -= 500; updateUI(); window.open(url, '_blank');
        } else { alert("Low Coins!"); }
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = sc.toString().padStart(4,'0') + " CR";
        localStorage.setItem('user_sc', sc);
    }
</script>
</body>
</html>
