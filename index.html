<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>ज्ञान-सागर स्कैनर</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        #result { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; border: 1px solid #ddd; min-height: 100px; text-align: left; }
    </style>
</head>
<body>

    <h1>ज्ञान-सागर स्कैनर</h1>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="processImage()">स्कैन करें</button>
    
    <div id="result">यहाँ जवाब दिखाई देगा...</div>

    <script>
        async function processImage() {
            // 1. अपनी नई API Key यहाँ डालें (जो आपने AI Studio से बनाई है)
            const API_KEY = "अपनी_नई_वाली_API_KEY_यहाँ_पेस्ट_करें"; 
            
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            
            if (!file) { alert("कृपया पहले फोटो चुनें!"); return; }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Data = e.target.result.split(',')[1];
                document.getElementById('result').innerText = "AI स्कैन कर रहा है, कृपया प्रतीक्षा करें...";

                const modelName = "gemini-3-flash-preview"; 
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`;

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ inline_data: { mime_type: "image/jpeg", data: base64Data } }] }]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.candidates) {
                        document.getElementById('result').innerText = data.candidates[0].content.parts[0].text;
                    } else {
                        document.getElementById('result').innerText = "त्रुटि: जवाब नहीं मिला। क्या आपकी API Key सही है?";
                    }
                } catch (error) {
                    document.getElementById('result').innerText = "नेटवर्क एरर: " + error.message;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
