<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX PRO v30.0 - REAL ENGINE</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000000; --card: #111; --gold: #ffcc00; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: white; margin: 0; overflow-x: hidden; height: 100vh; }

        /* 🔐 FULL SCREEN LOCK (No Leakage) */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        .system-title { color: var(--neon); font-size: 24px; letter-spacing: 3px; margin-bottom: 30px; font-weight: bold; }
        .rtx-input {
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            padding: 15px; color: white; text-align: center;
            font-size: 18px; border-radius: 12px; width: 85%; outline: none;
        }
        .init-btn {
            margin-top: 25px; width: 85%; background: var(--neon); 
            color: black; border: none; padding: 15px; border-radius: 12px;
            font-weight: bold; font-size: 16px; cursor: pointer;
        }

        /* 📱 MAIN CONTENT (Initially Hidden) */
        #main-app { display: none; padding: 15px; }

        /* 🏆 REAL-TIME LEADERBOARD */
        .lb-panel {
            background: #0a0a0a; border-radius: 15px; border: 1px solid #222;
            padding: 15px; margin-top: 10px;
        }
        .lb-head { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 10px; }
        .lb-item { 
            display: flex; justify-content: space-between; padding: 12px; 
            background: #111; margin-bottom: 5px; border-radius: 8px; border-left: 3px solid var(--neon);
            animation: slideIn 0.4s ease;
        }
        .scanning-text { color: var(--neon); text-align: center; font-size: 12px; padding: 10px; }

        /* 🔍 SEARCH & CREDITS (Now inside main-app) */
        .bottom-ui { margin-top: 20px; }
        .credit-box { border: 1px solid var(--gold); color: var(--gold); padding: 5px 15px; border-radius: 10px; display: inline-block; }
        .search-row { display: flex; gap: 10px; margin-top: 15px; }
        .search-bar { background: #111; border: 1px solid var(--neon); padding: 12px; border-radius: 10px; color: white; flex: 1; outline: none; }
        .mic-btn { background: var(--neon); border: none; padding: 10px; border-radius: 10px; width: 50px; }

        .pkg-row { display: flex; gap: 10px; margin-top: 20px; border-top: 1px solid #222; padding-top: 20px; }
        .pkg-input { background: #111; border: 1px solid var(--gold); padding: 10px; border-radius: 8px; color: white; flex: 1; outline: none; }
        .claim-btn { background: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="system-title">SYSTEM ACCESS</div>
        <input type="password" id="pass-input" class="rtx-input" placeholder="RTX or PIN">
        <button class="init-btn" onclick="unlock()">INITIALIZE</button>
        <p id="err" style="color: red; font-size: 12px; margin-top: 15px;"></p>
    </div>

    <div id="main-app">
        <div class="lb-head">
            <span style="color: var(--neon);">LIVE AI ENGINE</span>
            <span onclick="location.reload()" style="cursor:pointer">REFRESH ↻</span>
        </div>

        <div class="lb-panel" id="lb-panel">
            <div class="scanning-text">CONNECTING TO NETWORK... 📡</div>
        </div>

        <div class="bottom-ui">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="credit-box"><span id="bal">1500</span> CREDITS</div>
                <div style="font-size: 12px; color: var(--gold);">LEADERBOARD →</div>
            </div>

            <div class="search-row">
                <input type="text" class="search-bar" placeholder="Bolkar ya Likhkar...">
                <button class="mic-btn">🎤</button>
            </div>

            <div class="pkg-row">
                <input type="text" id="pkg-field" class="pkg-input" placeholder="pkg code">
                <button class="claim-btn" onclick="claim()">CLAIM</button>
            </div>
        </div>
    </div>

    <script>
        // 🔐 UNLOCK FUNCTION
        function unlock() {
            const pin = document.getElementById('pass-input').value;
            if(pin.toUpperCase() === 'RTX' || pin === '1111') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                fetchRealTrends(); // Unlock hote hi internet scan shuru
            } else {
                document.getElementById('err').innerText = "ACCESS DENIED!";
            }
        }

        // 🏆 REAL-TIME TRENDING ENGINE (FETCH LOGIC)
        async function fetchRealTrends() {
            const panel = document.getElementById('lb-panel');
            try {
                // Simulation of Real Fetch (Asli network call)
                // Note: Internet se dhoondne ka logic
                const trendingFromNet = ["Free Fire MAX", "Sigma Lite", "Minecraft 1.21"]; 
                const myAppList = ["Free Fire MAX", "Netflix Mod"]; // Hamare database mein kya hai

                panel.innerHTML = ""; // Clear loader

                trendingFromNet.forEach((app, i) => {
                    let exists = myAppList.includes(app);
                    panel.innerHTML += `
                        <div class="lb-item">
                            <span>#${i+1} ${app}</span>
                            <small style="color: ${exists ? 'var(--neon)' : '#ffae00'}">
                                ${exists ? '● IN VAULT' : '● ADDING...'}
                            </small>
                        </div>
                    `;
                });
            } catch (e) {
                panel.innerHTML = "Offline Mode Active.";
            }
        }

        // 💰 CLAIM SYSTEM
        let credits = 1500;
        function claim() {
            const code = document.getElementById('pkg-field').value;
            if(code === 'RANJAN_PRO') {
                credits += 1000;
                document.getElementById('bal').innerText = credits;
                alert("1000 Credits Received!");
            }
        }
    </script>
</body>
</html>
