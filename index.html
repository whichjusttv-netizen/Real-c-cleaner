<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX DOUBLE SHIELD</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000; --gold: #ffd700; }
        body { background: #050505; color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #app-frame { width: 92%; height: 92%; background: var(--bg); border: 1px solid #1a1a2e; border-radius: 30px; position: relative; overflow: hidden; }

        /* 🧮 CALCULATOR UI */
        #fake-calc { display: none; height: 100%; padding: 20px; flex-direction: column; background: #111; justify-content: space-between; box-sizing: border-box; }
        #calc-screen { background: #222; height: 80px; border-radius: 10px; text-align: right; padding: 20px; font-size: 30px; color: #0f0; border: 2px solid #333; overflow: hidden; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { background: #333; border: none; color: #fff; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* 🚀 ASLI APP UI */
        #real-app { display: none; height: 100%; position: relative; }
        .header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;}
        #main-list { height: 60%; overflow-y: auto; padding: 15px; }
        .card { background: #12121c; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid var(--neon); }

        /* 🔑 GATE */
        #gate { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-inp { width: 80%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #000; color: var(--neon); text-align: center; font-size: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="app-frame">
    
    <div id="gate">
        <h2 style="color: var(--neon);">SYSTEM BOOT</h2>
        <input type="password" id="first-pass" class="login-inp" placeholder="ENTER PIN">
        <button onclick="firstUnlock()" style="width:85%; padding:15px; background:var(--neon); border:none; border-radius:15px; font-weight:bold;">INITIALIZE</button>
    </div>

    <div id="fake-calc">
        <div id="calc-screen" id="display">0</div>
        <div class="calc-grid">
            <button class="calc-btn" onclick="calc('7')">7</button><button class="calc-btn" onclick="calc('8')">8</button><button class="calc-btn" onclick="calc('9')">9</button><button class="calc-btn">/</button>
            <button class="calc-btn" onclick="calc('4')">4</button><button class="calc-btn" onclick="calc('5')">5</button><button class="calc-btn" onclick="calc('6')">6</button><button class="calc-btn">*</button>
            <button class="calc-btn" onclick="calc('1')">1</button><button class="calc-btn" onclick="calc('2')">2</button><button class="calc-btn" onclick="calc('3')">3</button><button class="calc-btn">-</button>
            <button class="calc-btn" onclick="calc('0')">0</button><button class="calc-btn" onclick="clearCalc()">C</button><button class="calc-btn" onclick="checkFinal()" style="background:var(--neon); color:#000">=</button><button class="calc-btn">+</button>
        </div>
    </div>

    <div id="real-app">
        <div class="header">
            <span style="color:var(--gold); border:1px solid var(--gold); padding:5px 10px; border-radius:10px; font-size:12px;">CREDITS: <span id="coin-txt">0000</span></span>
            <h4 style="margin:0; color:var(--neon);">RTX VAULT</h4>
        </div>
        <div id="main-list">
            </div>
    </div>

</div>

<script>
    let credits = parseInt(localStorage.getItem('user_sc')) || 0;
    let calcInput = "";

    // 1. Pehla Lock: 1111 dalo toh Calc khulega
    function firstUnlock() {
        let p = document.getElementById('first-pass').value;
        if(p === "1111") {
            document.getElementById('gate').style.display = "none";
            document.getElementById('fake-calc').style.display = "flex";
        } else { alert("ACCESS DENIED"); }
    }

    // 2. Calculator Logic
    function calc(num) {
        calcInput += num;
        document.getElementById('calc-screen').innerText = calcInput;
    }

    function clearCalc() {
        calcInput = "";
        document.getElementById('calc-screen').innerText = "0";
    }

    // 3. Dusra Lock: Calc mein 1111 dalo toh Real App khulega
    function checkFinal() {
        if(calcInput === "1111") {
            document.getElementById('fake-calc').style.display = "none";
            document.getElementById('real-app').style.display = "block";
            loadApps();
            updateUI();
        } else {
            // Normal behavior: clear or do nothing
            alert("Calculation Error");
            clearCalc();
        }
    }

    function loadApps() {
        const list = document.getElementById('main-list');
        let html = "";
        const apps = ["Free Fire Tool", "Netflix Premium", "GTA Mod", "Spotify Plus"];
        for(let i=1; i<=20; i++) {
            html += `<div class="card">
                <h4 style="margin:0;">${apps[i % apps.length]} #${i}</h4>
                <button style="margin-top:10px; width:100%; border:none; background:var(--neon); padding:8px; border-radius:10px; font-weight:bold;">GET SOURCE</button>
            </div>`;
        }
        list.innerHTML = html;
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = credits.toString().padStart(4, '0');
    }
</script>
</body>
</html>
