<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280"> <title>Ranjan Desktop Mega Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; overflow: hidden; width: 1280px; }

        /* Navigation Bar */
        .nav-system { 
            height: 60px; 
            background: linear-gradient(90deg, #121212, #1f1f1f); 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            border-bottom: 3px solid #00e676;
            gap: 15px;
        }

        #urlBox { 
            flex: 1; 
            background: #2a2a2a; 
            border: 1px solid #444; 
            padding: 12px; 
            color: #00e676; 
            border-radius: 8px; 
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .desktop-btn { 
            background: #00e676; 
            color: #000; 
            padding: 10px 25px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 900; 
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Desktop Container */
        #frameWrapper {
            width: 1280px;
            height: calc(100vh - 63px);
            overflow: auto;
            background: #fff;
        }

        #desktopFrame {
            width: 100%; /* Full PC Width */
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="nav-system">
    <div style="color: #00e676; font-weight: bold;">DESKTOP MODE: ON</div>
    <input type="text" id="urlBox" placeholder="Enter Heavy URL (e.g. chatgpt.com)" onkeydown="if(event.key==='Enter') launchDesktop()">
    <button class="desktop-btn" onclick="launchDesktop()">Force Desktop Load</button>
</div>

<div id="frameWrapper">
    <iframe id="desktopFrame" src="https://www.google.com/search?igu=1" allowfullscreen></iframe>
</div>

<script>
    function launchDesktop() {
        let url = document.getElementById('urlBox').value;
        let frame = document.getElementById('desktopFrame');

        if (!url) return;
        if (!url.startsWith('http')) url = 'https://' + url;

        /* ULTRA PROXY SECRET: 
           Ye proxy website ka 'Mobile' signal kat deta hai aur sirf 'Desktop' signal bhejta hai.
        */
        let desktopProxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
        
        frame.src = desktopProxy;

        // Visual confirmation for recording
        console.log("Injecting Desktop Headers for: " + url);
    }
</script>

</body>
</html>
