<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supreme Game Engine - Ranjan Edition</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #252525; border-right: 2px solid #ff4444; padding: 20px; display: flex; flex-direction: column; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; }
        #game-canvas-container { flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        canvas { border: 2px solid #555; background: #333; box-shadow: 0 0 20px rgba(255,68,68,0.3); }
        textarea { width: 100%; height: 200px; background: #111; color: #0f0; border: 1px solid #444; font-family: monospace; resize: none; margin-top: 10px; }
        .btn { background: #ff4444; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 5px; }
        .btn:hover { background: #cc0000; }
        h2 { color: #ff4444; margin-top: 0; }
        .status { font-size: 12px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>SUPREME ENGINE</h2>
    <label>Game Logic (JavaScript):</label>
    <textarea id="code-editor">
// Edit your game here!
player.x += 2; 
if(player.x > canvas.width) player.x = 0;
    </textarea>
    <button class="btn" onclick="updateGameLogic()">RUN ENGINE 🚀</button>
    
    <div class="status">
        System: Online <br>
        Mode: GitHub Live <br>
        Dev: Ranjan (Boss)
    </div>
</div>

<div id="main-view">
    <div id="game-canvas-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let player = { x: 50, y: 180, size: 40, color: '#ff4444' };
    let gameRunning = true;
    let customLogic = "";

    function updateGameLogic() {
        customLogic = document.getElementById('code-editor').value;
        console.log("Logic Updated by Boss!");
    }

    function gameLoop() {
        // Clear Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Player (Katta King)
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.size, player.size);
        
        // Draw Text
        ctx.fillStyle = "white";
        ctx.fillText("ENGINE LIVE PREVIEW", 10, 20);

        // Execute Custom Code
        try {
            eval(customLogic);
        } catch(e) {}

        requestAnimationFrame(gameLoop);
    }

    updateGameLogic();
    gameLoop();
</script>

</body>
</html>
