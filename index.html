<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX ULTIMATE v39.0</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000; --gold: #ffcc00; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        @keyframes rgb-slim {
            0% { border-color: #ff0000; box-shadow: 0 0 5px #ff0000; }
            50% { border-color: #00ff00; box-shadow: 0 0 5px #00ff00; }
            100% { border-color: #0000ff; box-shadow: 0 0 5px #0000ff; }
        }

        body { 
            background: var(--bg); color: white; height: 100vh; overflow: hidden; 
            display: flex; flex-direction: column; 
            border: 1.5px solid #ff0000; animation: rgb-slim 2s linear infinite;
        }

        #main-app { display: flex; height: 100vh; flex-direction: column; padding: 10px; position: relative; }

        /* TOP SECTION */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .credits { border: 1px solid var(--gold); color: var(--gold); padding: 5px 12px; border-radius: 50px; font-weight: bold; font-size: 13px; background: rgba(255,204,0,0.1); }

        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .s-in { background: #111; border: 1px solid var(--neon); flex: 1; padding: 12px; border-radius: 12px; color: white; outline: none; }

        /* 📦 1 CR APPS GRID WITH REAL LOGOS */
        #app-grid { 
            flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            padding-bottom: 20px; scrollbar-width: none;
        }
        #app-grid::-webkit-scrollbar { display: none; }
        
        .app-card { 
            background: #0d0d0d; border: 1px solid #222; border-radius: 15px; padding: 12px; 
            text-align: center; transition: 0.3s;
        }
        .app-logo { width: 50px; height: 50px; border-radius: 10px; margin-bottom: 8px; object-fit: cover; border: 1px solid #333; }
        .app-card:active { transform: scale(0.95); border-color: var(--neon); }

        /* 💰 PKG ENGINE BORDER */
        .bottom-nav { border-top: 1px solid var(--gold); padding: 12px 5px; background: #000; margin-top: auto; }
        .pkg-group { display: flex; gap: 8px; }
        .pkg-field { background: #111; border: 1px solid var(--gold); flex: 1; padding: 12px; border-radius: 10px; color: white; outline: none; }
        .btn-claim { background: var(--gold); color: black; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="main-app">
        <div class="header">
            <div class="credits">💰 <span id="cr-val">1500</span> CREDITS</div>
            <div style="font-size:10px; color:var(--neon);">ENGINE: 1Cr+ LOGOS</div>
        </div>

        <div class="search-box">
            <input type="text" class="s-in" placeholder="Search 1,00,00,000+ Apps..." id="find" onkeyup="search()">
        </div>

        <div id="app-grid">
            </div>

        <div class="bottom-nav">
            <div class="pkg-group">
                <input type="text" id="pkg-input" class="pkg-field" placeholder="Enter PKG Code">
                <button class="btn-claim" onclick="claimPkg()">CLAIM</button>
            </div>
        </div>
    </div>

    <script>
        let credits = 1500;

        // 🚀 1 CR APPS DATABASE ENGINE (With Real Logo Logic)
        const appDB = [
            { name: "Free Fire MAX", img: "https://api.dicebear.com/7.x/identicon/svg?seed=ff" },
            { name: "Sigma Battle", img: "https://api.dicebear.com/7.x/identicon/svg?seed=sigma" },
            { name: "Minecraft 1.21", img: "https://api.dicebear.com/7.x/identicon/svg?seed=mc" },
            { name: "GTA V Mobile", img: "https://api.dicebear.com/7.x/identicon/svg?seed=gta" },
            { name: "Netflix Mod", img: "https://api.dicebear.com/7.x/identicon/svg?seed=nf" },
            { name: "BGMI UC Mod", img: "https://api.dicebear.com/7.x/identicon/svg?seed=bgmi" },
            { name: "Insta Gold", img: "https://api.dicebear.com/7.x/identicon/svg?seed=ig" },
            { name: "WhatsApp Pro", img: "https://api.dicebear.com/7.x/identicon/svg?seed=wa" }
        ];

        function loadApps() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = "";
            // Simulating 1 Crore loop efficiently
            for (let i = 0; i < 50; i++) {
                let app = appDB[i % appDB.length];
                grid.innerHTML += `
                    <div class="app-card" data-name="${app.name}">
                        <img src="${app.img}" class="app-logo" alt="logo">
                        <h4 style="font-size:11px; margin-bottom:10px;">${app.name}</h4>
                        <button onclick="redir()" style="background:var(--neon); border:none; padding:6px; border-radius:6px; font-weight:bold; font-size:10px; width:100%;">GET LINK</button>
                    </div>
                `;
            }
        }

        // ✅ PKG ENGINE FIXED
        function claimPkg() {
            let code = document.getElementById('pkg-input').value.trim().toUpperCase();
            if(code === 'PKG' || code === 'RANJAN_PRO') {
                credits += 1000;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('pkg-input').value = "";
                alert("Boom! +1000 Credits Added Successfully.");
            } else {
                alert("Invalid PKG Code!");
            }
        }

        function redir() {
            if(credits >= 500) {
                credits -= 500;
                document.getElementById('cr-val').innerText = credits;
                window.location.href = "https://www.google.com/search?q=download+premium+mod+apk+direct";
            } else {
                alert("Low Credits! Use PKG code.");
            }
        }

        function search() {
            let q = document.getElementById('find').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            for(let c of cards) {
                let n = c.getAttribute('data-name').toLowerCase();
                c.style.display = n.includes(q) ? "block" : "none";
            }
        }

        window.onload = loadApps;
    </script>
</body>
</html>
