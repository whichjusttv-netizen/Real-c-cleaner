<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX BHARAT v78.0 | ARCHITECT EDITION</title>
    <style>
        :root { --saffron: #FF9933; --green: #138808; --bg: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        /* 📱 MAIN STRUCTURE (Padding added for status/nav bars) */
        body { 
            background: var(--bg); 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            padding-top: 10px; /* Status bar space */
            padding-bottom: 60px; /* Back button space */
        }

        /* 📡 HEADER (Compact Structure) */
        .rtx-header { 
            background: #0a0a0a; 
            padding: 10px; 
            text-align: center; 
            border-bottom: 2px solid var(--saffron);
            margin: 0 10px;
            border-radius: 8px;
        }
        
        /* 🔍 SEARCH BOX */
        .search-container { padding: 10px 15px; }
        #app-search { 
            width: 100%; padding: 10px; border-radius: 20px; 
            border: 1px solid #333; background: #111; color: white; 
            outline: none; font-size: 14px;
        }

        /* 📦 APP VAULT (2000 Apps Ready) */
        #app-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px 15px; 
            scrollbar-width: none; 
        }
        .app-card { 
            background: #0d0d0d; border: 1px solid #222; border-radius: 10px; 
            padding: 10px; margin-bottom: 8px; display: flex; 
            align-items: center; justify-content: space-between; 
        }
        .app-info { display: flex; align-items: center; gap: 10px; }
        .app-info img { width: 35px; height: 35px; border-radius: 6px; }
        .app-name { font-size: 13px; font-weight: 600; }

        .get-btn { 
            background: var(--green); color: white; border: none; 
            padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: bold; 
        }

        /* 🌐 BROWSER OVERLAY */
        #browser-overlay { 
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:white; z-index:9999; flex-direction:column; 
        }
        iframe { flex:1; border:none; width:100%; }
    </style>
</head>
<body>

    <div class="rtx-header">
        <h1 style="font-size:16px;">RTX <span style="color:var(--saffron)">BHARAT</span> <small style="font-size:10px;">v78.0</small></h1>
    </div>

    <div class="search-container">
        <input type="text" id="app-search" placeholder="Search 2000+ Premium Apps..." oninput="filterApps()">
    </div>

    <div id="app-list">
        </div>

    <div id="browser-overlay">
        <div style="background:#f2f2f2; padding:10px; display:flex; justify-content:space-between; align-items:center;">
            <button onclick="closeBrowser()" style="padding:5px 15px; border:1px solid #ccc; background:#fff; font-weight:bold;">← CLOSE</button>
            <span style="color:black; font-size:12px; font-weight:bold;">Google Search Results</span>
        </div>
        <iframe id="web-frame" src=""></iframe>
    </div>

    <script>
        // 🗄️ MEGA DATABASE (Ready for 2000 entries)
        const db = [
            { n: "Spotify Premium", t: "s", q: "Spotify Premium Mod 2026" },
            { n: "Sigma Battle Royale", t: "d", u: "https://sigma-battle-royale.en.softonic.com/android/download" },
            { n: "ZArchiver Pro", t: "d", u: "https://zarchiver.en.softonic.com/android/download" },
            { n: "MT Manager VIP", t: "s", q: "MT Manager VIP APK Download" },
            { n: "Lucky Patcher", t: "s", q: "Lucky Patcher Official" }
            // Architect Sahab, yahan aap 2000 apps copy-paste kar sakte hain
        ];

        function render(data) {
            const list = document.getElementById('app-list');
            list.innerHTML = "";
            data.forEach(app => {
                list.innerHTML += `
                <div class="app-card">
                    <div class="app-info">
                        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${app.n}">
                        <div class="app-name">${app.n}</div>
                    </div>
                    <button class="get-btn" onclick="handle('${app.n}')">GET</button>
                </div>`;
            });
        }

        function filterApps() {
            const val = document.getElementById('app-search').value.toLowerCase();
            const filtered = db.filter(a => a.n.toLowerCase().includes(val));
            render(filtered);
        }

        function handle(name) {
            const app = db.find(a => a.n === name);
            if(app.t === "s") {
                const url = `https://www.google.com/search?q=${encodeURIComponent(app.q)}&igu=1`;
                document.getElementById('browser-overlay').style.display = 'flex';
                document.getElementById('web-frame').src = url;
            } else {
                window.location.href = app.u;
            }
        }

        function closeBrowser() {
            document.getElementById('browser-overlay').style.display = 'none';
            document.getElementById('web-frame').src = "";
        }

        window.onload = () => render(db);
    </script>
</body>
</html>
