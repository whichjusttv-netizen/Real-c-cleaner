<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX BHARAT v69.0</title>
    <style>
        :root { --saffron: #FF9933; --white: #FFFFFF; --green: #138808; --bg: #000; --blue: #000080; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

        #main-container { 
            width: 96%; max-width: 400px; height: 98vh; background: var(--bg);
            border-top: 4px solid var(--saffron); border-bottom: 4px solid var(--green);
            display: flex; flex-direction: column; position: relative;
        }

        .header { padding: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        .rolling-bar { background: #111; padding: 5px; font-size: 10px; color: var(--saffron); overflow: hidden; white-space: nowrap; border-bottom: 1px solid #333; }
        .rolling-text { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* CONTENT AREA */
        #content-area { flex-grow: 1; overflow-y: auto; padding: 12px; padding-bottom: 80px; scrollbar-width: none; }
        
        /* HOME PAGE STYLE */
        .hero-banner { background: linear-gradient(45deg, #111, #222); padding: 20px; border-radius: 15px; border: 1px solid var(--saffron); margin-bottom: 15px; text-align: center; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-card { background: #0a0a0a; border: 1px solid #333; border-radius: 12px; padding: 15px; text-align: center; position: relative; }
        .item-card img { width: 45px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--saffron); }
        .btn-target { background: var(--green); color: white; border: none; padding: 8px; border-radius: 5px; font-size: 10px; font-weight: 900; width: 100%; cursor: pointer; }

        /* 🔘 BOTTOM NAVIGATION BAR */
        .bottom-nav { 
            position: absolute; bottom: 0; width: 100%; background: #050505; 
            display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #333;
        }
        .nav-item { color: #666; font-size: 10px; text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--saffron); font-weight: bold; }
        .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }

        /* ⚪ REDIRECT NOTICE PAGE */
        #notice-page { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; color: black; display: none; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 25px;
        }
        #redirect-bar { position: absolute; top: 0; left: 0; width: 100%; background: #f1f3f4; border-bottom: 2px solid #ccc; padding: 12px; font-size: 10px; }
        .main-btn { background: #000; color: white; padding: 18px; border-radius: 10px; text-decoration: none; width: 100%; display: block; text-align: center; font-weight: bold; margin-top: 20px; border: 2px solid var(--green); }
    </style>
</head>
<body>

    <div id="main-container">
        <div class="header">
            <span style="font-weight: 900;">RTX <span style="color:var(--saffron)">BHARAT</span> 🇮🇳</span>
            <div style="color:var(--saffron); font-weight: bold;">💎 <span id="cr-val">1500</span></div>
        </div>

        <div class="rolling-bar"><div class="rolling-text">🛡️ BHARAT DIRECT ENGINE | APPS, MOVIES & PREMIUM TOOLS ACTIVE | NO GOOGLE SEARCH 🚀</div></div>

        <div id="content-area"></div>

        <div id="notice-page">
            <div id="redirect-bar"><span style="color:red; font-weight:900;">⚠️ BHARAT REDIRECT</span><br><span id="display-url" style="color:#1a73e8; font-weight:bold; word-break:break-all;"></span></div>
            <div style="border: 2px solid #ddd; border-radius: 15px; padding: 20px; width: 100%; text-align: center;">
                <h2 id="t-name">ITEM NAME</h2>
                <p style="font-size:11px; color:#555; margin-top:8px;">Bypassing Play Store... Direct server connection established.</p>
            </div>
            <a href="#" class="main-btn" id="f-link">SECURE DOWNLOAD</a>
            <button onclick="closeP()" style="margin-top:20px; color:gray; background:none; border:none; text-decoration:underline;">Back</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showPage('home', this)"><span class="nav-icon">🏠</span>HOME</div>
            <div class="nav-item" onclick="showPage('apps', this)"><span class="nav-icon">📱</span>APPS</div>
            <div class="nav-item" onclick="showPage('movies', this)"><span class="nav-icon">🎬</span>MOVIES</div>
            <div class="nav-item" onclick="alert('Bharat PKG Needed')"><span class="nav-icon">⚙️</span>TOOLS</div>
        </div>
    </div>

    <script>
        let credits = 1500;
        const appData = [ "Lucky Patcher VIP", "MT Manager Pro", "Game Guardian", "NP Manager", "WhatsApp Plus", "Spotify Premium" ];
        const movieData = [ "Pathaan 2 Full HD", "Pushpa 2 Hindi", "GTA 5 Movie", "Stree 2 HD", "Avatar 3 Web-DL" ];

        function showPage(page, el) {
            // Update Navigation UI
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');

            const area = document.getElementById('content-area');
            area.innerHTML = "";

            if (page === 'home') {
                area.innerHTML = `
                    <div class="hero-banner">
                        <h2 style="color:var(--saffron)">MERA BHARAT</h2>
                        <p style="font-size:12px;">Welcome to the Forbidden Vault.<br>Everything here is Bypassed.</p>
                    </div>
                    <h3 style="margin-bottom:10px; font-size:14px;">🔥 TRENDING NOW</h3>
                    <div class="grid-layout">
                        <div class="item-card"><img src="https://api.dicebear.com/7.x/identicon/svg?seed=1"><div>Sigma Battle</div><button class="btn-target" onclick="openP('Sigma Battle')">DOWNLOAD</button></div>
                        <div class="item-card"><img src="https://api.dicebear.com/7.x/identicon/svg?seed=2"><div>HappyMod</div><button class="btn-target" onclick="openP('HappyMod')">DOWNLOAD</button></div>
                    </div>
                `;
            } else if (page === 'apps') {
                area.innerHTML = `<h3 style="margin-bottom:15px;">PREMIUM BANNED APPS</h3><div class="grid-layout">` + 
                appData.map(name => `<div class="item-card"><img src="https://api.dicebear.com/7.x/initials/svg?seed=${name}"><div>${name}</div><button class="btn-target" onclick="openP('${name}')">TARGET LINK</button></div>`).join('') + `</div>`;
            } else if (page === 'movies') {
                area.innerHTML = `<h3 style="margin-bottom:15px;">LATEST BHARAT MOVIES</h3><div class="grid-layout">` + 
                movieData.map(name => `<div class="item-card"><img src="https://api.dicebear.com/7.x/shapes/svg?seed=${name}"><div>${name}</div><button class="btn-target" onclick="openP('${name}')">WATCH NOW</button></div>`).join('') + `</div>`;
            }
        }

        function openP(name) {
            if(credits >= 500) {
                credits -= 500;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('t-name').innerText = name.toUpperCase();
                let q = name.toLowerCase().replace(/\s+/g, '-');
                let finalUrl = `https://${q}.en.uptodown.com/android/download`;
                document.getElementById('f-link').href = finalUrl;
                document.getElementById('display-url').innerText = finalUrl;
                document.getElementById('notice-page').style.display = 'flex';
            } else { alert("Insufficient Credits!"); }
        }

        function closeP() { document.getElementById('notice-page').style.display = 'none'; }
        
        window.onload = () => showPage('home', document.querySelector('.nav-item'));
    </script>
</body>
</html>
