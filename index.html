<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX COMPLETE VAULT</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000; --gold: #ffd700; --danger: #ff0055; }
        body { background: #050505; color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        #app-frame { width: 92%; height: 92%; background: var(--bg); border: 1px solid #1a1a2e; border-radius: 30px; position: relative; overflow: hidden; }

        /* 🧮 FAKE CALCULATOR */
        #fake-calc { display: none; height: 100%; padding: 20px; flex-direction: column; background: #111; justify-content: space-between; box-sizing: border-box; }
        #calc-screen { background: #222; height: 80px; border-radius: 10px; text-align: right; padding: 20px; font-size: 30px; color: #0f0; border: 2px solid #333; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { background: #333; border: none; color: #fff; padding: 15px; border-radius: 10px; font-weight: bold; }

        /* 🏆 LEADERBOARD PANEL (Right Slide) */
        #leaderboard { position: absolute; top: 0; right: -100%; width: 85%; height: 100%; background: rgba(5,5,15,0.95); backdrop-filter: blur(15px); z-index: 1000; transition: 0.5s; padding: 20px; border-left: 2px solid var(--gold); box-sizing: border-box; }
        .lb-active #leaderboard { right: 0; }
        .lb-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; font-size: 13px; }

        /* 🚀 REAL APP UI */
        #real-app { display: none; height: 100%; position: relative; }
        .header { padding: 15px; border-bottom: 1px solid #222; }
        
        /* 🎤 SEARCH AREA */
        .search-area { display: flex; gap: 8px; margin: 10px 0; align-items: center; }
        #search-bar { flex: 1; padding: 12px; background: #0a0a0f; border: 1px solid var(--neon); color: var(--neon); border-radius: 12px; outline: none; }
        .mic-btn { background: var(--neon); color: #000; border: none; padding: 12px; border-radius: 12px; cursor: pointer; }

        #main-list { height: 50%; overflow-y: auto; padding: 10px; scrollbar-width: none; }
        .card { background: #12121c; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid var(--neon); }

        .footer { position: absolute; bottom: 0; width: 100%; background: #000; padding: 15px; border-top: 1px solid #111; display: flex; gap: 8px; box-sizing: border-box; }
        
        #gate { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-inp { width: 80%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #000; color: var(--neon); text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body id="body-main">

<div id="app-frame">
    
    <div id="gate">
        <h2 style="color: var(--neon);">RTX CORE</h2>
        <input type="password" id="master-pass" class="login-inp" placeholder="PASSWORD">
        <button onclick="checkAccess()" style="width:85%; padding:15px; background:var(--neon); border:none; border-radius:15px; font-weight:bold;">ACCESS</button>
    </div>

    <div id="leaderboard">
        <h2 style="color:var(--gold); text-align:center;">🏆 TRENDING</h2>
        <div id="lb-content">
            <div class="lb-item"><span>#1 Gemini AI</span> <span style="color:var(--neon)">99k 🔥</span></div>
            <div class="lb-item"><span>#2 Netflix 4K</span> <span style="color:var(--neon)">85k 🔥</span></div>
            <div class="lb-item"><span>#3 GTA VI</span> <span style="color:var(--neon)">72k 🔥</span></div>
        </div>
        <button onclick="toggleLB()" style="width:100%; margin-top:20px; padding:12px; background:var(--danger); border:none; color:#fff; border-radius:10px;">BACK</button>
    </div>

    <div id="fake-calc">
        <div id="calc-screen">0</div>
        <div class="calc-grid">
            <button class="calc-btn">7</button><button class="calc-btn">8</button><button class="calc-btn">9</button><button class="calc-btn">/</button>
            <button class="calc-btn">4</button><button class="calc-btn">5</button><button class="calc-btn">6</button><button class="calc-btn">*</button>
            <button class="calc-btn">1</button><button class="calc-btn">2</button><button class="calc-btn">3</button><button class="calc-btn">-</button>
            <button class="calc-btn">0</button><button class="calc-btn">C</button><button class="calc-btn" style="background:var(--neon); color:#000">=</button><button class="calc-btn">+</button>
        </div>
    </div>

    <div id="real-app">
        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="coin-txt" style="color:var(--gold); font-weight:bold; border:1px solid var(--gold); padding:4px 10px; border-radius:10px;">0000</span>
                <span style="color:var(--gold); font-size:10px;" onclick="toggleLB()">LEADERBOARD ➔</span>
            </div>
            <div class="search-area">
                <input type="text" id="search-bar" placeholder="Khojo..." onkeyup="filterApps()">
                <button class="mic-btn" onclick="startVoice()">🎤</button>
            </div>
        </div>

        <div id="main-list"></div>

        <div class="footer">
            <input type="text" id="pkg-inp" placeholder="pkg code" style="flex:1; background:#111; border:1px solid var(--gold); color:var(--gold); border-radius:10px; padding:10px; text-align:center;">
            <button onclick="claimPkg()" style="background:var(--gold); padding:10px 20px; border-radius:10px; font-weight:bold;">CLAIM</button>
        </div>
    </div>

</div>

<script>
    let credits = parseInt(localStorage.getItem('user_sc')) || 0;
    let database = [];

    function checkAccess() {
        const pass = document.getElementById('master-pass').value;
        const gate = document.getElementById('gate');
        if(pass === "RTX") {
            gate.style.display = "none";
            document.getElementById('real-app').style.display = "block";
            buildDatabase(); render(database); updateUI();
        } else if(pass === "1111") {
            gate.style.display = "none";
            document.getElementById('fake-calc').style.display = "flex";
        } else { alert("WRONG!"); }
    }

    function buildDatabase() {
        const apps = ["Gemini AI", "Netflix", "Minecraft", "GTA VI", "Spotify", "Canva Pro", "PicsArt", "CapCut Pro"];
        database = [];
        for(let i=1; i<=1000; i++) {
            database.push({ n: `${apps[i % apps.length]} Premium #${i}`, s: `https://www.google.com/search?q=${apps[i % apps.length]}+premium` });
        }
    }

    function render(list) {
        const container = document.getElementById('main-list');
        let html = "";
        let limit = Math.min(list.length, 30);
        for(let i=0; i<limit; i++) {
            html += `<div class="card">
                <h4 style="margin:0; font-size:14px; color:var(--neon);">${list[i].n}</h4>
                <button onclick="window.open('${list[i].s}')" style="margin-top:8px; width:100%; padding:8px; background:var(--neon); border:none; border-radius:8px; font-weight:bold;">DOWNLOAD</button>
            </div>`;
        }
        container.innerHTML = html;
    }

    function startVoice() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'hi-IN'; rec.start();
        rec.onresult = (e) => { document.getElementById('search-bar').value = e.results[0][0].transcript; filterApps(); };
    }

    function filterApps() {
        let q = document.getElementById('search-bar').value.toLowerCase();
        let filtered = database.filter(a => a.n.toLowerCase().includes(q));
        render(filtered);
    }

    function toggleLB() { document.getElementById('app-frame').classList.toggle('lb-active'); }

    function claimPkg() {
        if(document.getElementById('pkg-inp').value.trim().toLowerCase() === "pkg") {
            credits += 1000; updateUI(); alert("1000 CR Added!");
            document.getElementById('pkg-inp').value = "";
        }
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = credits.toString().padStart(4, '0');
        localStorage.setItem('user_sc', credits);
    }

    // Fake Calc Buttons
    document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            let screen = document.getElementById('calc-screen');
            if(btn.innerText === "C") screen.innerText = "0";
            else if(screen.innerText === "0") screen.innerText = btn.innerText;
            else screen.innerText += btn.innerText;
        });
    });
</script>
</body>
</html>
