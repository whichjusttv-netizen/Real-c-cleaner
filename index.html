<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX BHARAT v69.0</title>
    <style>
        :root { --saffron: #FF9933; --green: #138808; --bg: #0d0d0d; --card: #1a1a1a; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

        /* 📱 COMPACT STRUCTURE */
        #main-container { 
            width: 100%; max-width: 400px; height: 100vh; background: var(--bg);
            display: flex; flex-direction: column; position: relative; border: 1px solid #333;
        }

        /* 🔍 GLOBAL SEARCH BAR (Internet Connected) */
        .search-box { padding: 10px; background: #050505; display: flex; gap: 8px; border-bottom: 1px solid #222; }
        .search-box input { 
            flex: 1; background: #1a1a1a; border: 1px solid #444; padding: 8px 15px; 
            border-radius: 20px; color: white; font-size: 13px; outline: none;
        }

        /* ☰ HEADER & MENU */
        .header { padding: 12px; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .menu-btn { font-size: 24px; cursor: pointer; color: var(--saffron); }
        .user-id { font-size: 11px; background: #222; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--green); }

        /* 📂 SIDEBAR (Drawer) */
        #sidebar { 
            position: absolute; top: 0; left: -280px; width: 280px; height: 100%; 
            background: #111; z-index: 2000; transition: 0.3s; padding: 20px;
            box-shadow: 10px 0 20px rgba(0,0,0,0.5); border-right: 2px solid var(--saffron);
        }
        #sidebar.active { left: 0; }
        .sidebar-item { padding: 15px; border-bottom: 1px solid #222; font-weight: bold; cursor: pointer; color: #ccc; }
        .sidebar-item:hover { color: var(--saffron); background: #1a1a1a; }

        /* 🎞️ CONTENT AREA */
        #content-area { flex-grow: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; scrollbar-width: none; }
        .item-card { background: var(--card); border-radius: 10px; padding: 10px; text-align: center; border-bottom: 3px solid var(--green); }
        .item-card img { width: 50px; height: 50px; border-radius: 8px; margin-bottom: 8px; }
        .btn-action { background: var(--green); border: none; color: white; padding: 6px; width: 100%; border-radius: 4px; font-size: 11px; font-weight: bold; }

        /* OVERLAY */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="main-container">
        <div id="sidebar">
            <h3 style="color:var(--saffron); margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px;">RTX EXPLORER</h3>
            <div class="sidebar-item" onclick="showCat('Premium Apps')">📁 Premium Apps</div>
            <div class="sidebar-item" onclick="showCat('Premium Movies')">🎬 Premium Movies</div>
            <div class="sidebar-item" onclick="showCat('Hacking Tools')">🛠️ Hacking Tools</div>
            <div class="sidebar-item" onclick="showCat('Web Series')">📺 Web Series</div>
            <div class="sidebar-item" onclick="showCat('Software')">💻 PC Software</div>
            <div style="margin-top:50px; font-size:10px; color:gray;">BHARAT ID: <span id="sid">BH-99234</span></div>
        </div>

        <div class="header">
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
            <div style="font-weight:900; letter-spacing:1px;">RTX <span style="color:var(--saffron)">BHARAT</span></div>
            <div class="user-id" id="profile-id">ID: BHARAT-786</div>
        </div>

        <div class="search-box">
            <input type="text" id="mainSearch" placeholder="Search Movies, Apps, or Mods..." onkeyup="searchNet()">
        </div>

        <div id="content-area">
            </div>
    </div>

    <script>
        // 🆔 AUTO PROFILE GENERATOR
        const myID = "BH-" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('profile-id').innerText = "ID: " + myID;
        document.getElementById('sid').innerText = myID;

        const data = [
            { name: "Pushpa 2 Full", cat: "Premium Movies", type: "4K" },
            { name: "Lucky Patcher", cat: "Hacking Tools", type: "VIP" },
            { name: "Mirzapur S3", cat: "Web Series", type: "HD" },
            { name: "MT Manager", cat: "Hacking Tools", type: "MOD" },
            { name: "Netflix Mod", cat: "Premium Apps", type: "FREE" },
            { name: "GTA V Mobile", cat: "Premium Apps", type: "BETA" },
            { name: "Kantara A-1", cat: "Premium Movies", type: "HD" }
        ];

        function load(filter = "") {
            const area = document.getElementById('content-area');
            area.innerHTML = "";
            const filtered = filter ? data.filter(i => i.cat === filter) : data;
            
            filtered.forEach(item => {
                area.innerHTML += `
                    <div class="item-card">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${item.name}">
                        <div style="font-size:11px; font-weight:bold; margin-bottom:5px;">${item.name}</div>
                        <button class="btn-action" onclick="alert('Connecting to Bharat Server...')">GET ${item.type}</button>
                    </div>
                `;
            });
        }

        function toggleMenu() {
            const side = document.getElementById('sidebar');
            const over = document.getElementById('overlay');
            if(side.classList.contains('active')) {
                side.classList.remove('active');
                over.style.display = 'none';
            } else {
                side.classList.add('active');
                over.style.display = 'block';
            }
        }

        function showCat(cat) {
            load(cat);
            toggleMenu();
        }

        function searchNet() {
            let val = document.getElementById('mainSearch').value.toLowerCase();
            const area = document.getElementById('content-area');
            area.innerHTML = "";
            data.forEach(item => {
                if(item.name.toLowerCase().includes(val)) {
                    area.innerHTML += `
                        <div class="item-card">
                            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${item.name}">
                            <div style="font-size:11px; font-weight:bold; margin-bottom:5px;">${item.name}</div>
                            <button class="btn-action">SEARCH RESULTS</button>
                        </div>
                    `;
                }
            });
        }

        window.onload = () => load();
    </script>
</body>
</html>
