<script src="https://cdn.jsdelivr.net/npm/unity-ads-sdk@4.0.0/dist/unity-ads.min.js"></script>

<script>
    const UNITY_ID = "6096974"; // Aapki ID
    let isUnityReady = false;
    let coins = parseInt(localStorage.getItem('sys_coins')) || 0;

    // --- UNITY FIX LOGIC START ---
    function initUnitySystem() {
        console.log("Connecting to Unity Server...");
        
        // Unity ko initialize karna
        UnityAds.initialize(UNITY_ID, true, (success) => {
            if (success) {
                console.log("Unity Ready ✅");
                isUnityReady = true;
                document.getElementById('stat-text').innerText = "● UNITY CONNECTED";
                document.getElementById('stat-text').style.color = "#00ff9d";
            } else {
                console.log("Unity Failed ❌. Retrying in 2 seconds...");
                isUnityReady = false;
                // Retry loop: Jab tak connect na ho, koshish karte raho
                setTimeout(initUnitySystem, 2000);
            }
        });
    }

    // App khulte hi connection shuru
    window.onload = () => {
        initUnitySystem();
        updateUI();
    };

    function unityAdTask() {
        if (isUnityReady) {
            // "Rewarded_Android" aapka default placement ID hona chahiye
            UnityAds.show('Rewarded_Android', {
                onStart: (placementId) => console.log("Ad Started"),
                onComplete: (placementId, state) => {
                    if (state === 'COMPLETED') {
                        coins += 50;
                        updateUI();
                        alert("Success! 50 Coins Added.");
                    }
                },
                onError: (error) => {
                    alert("Ad Error: " + error);
                    // Agar error aaye toh dubara initialize karo
                    initUnitySystem();
                }
            });
        } else {
            alert("Unity abhi connect ho raha hai... 1 second rukiye!");
            initUnitySystem(); // Force reconnect
        }
    }
    // --- UNITY FIX LOGIC END ---

    function updateUI() {
        document.getElementById('coin-txt').innerText = coins.toString().padStart(4, '0');
        localStorage.setItem('sys_coins', coins);
    }
</script>
