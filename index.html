<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-VOICE | Force Mic Access</title>
    <style>
        :root { --red: #ff0040; --black: #000; }
        body { background: var(--black); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        .studio-frame { border: 2px solid var(--red); padding: 30px; border-radius: 20px; background: #0a0a0a; }
        .main-btn { 
            width: 90px; height: 90px; border-radius: 50%; border: none; 
            background: var(--red); color: white; font-size: 30px; 
            cursor: pointer; box-shadow: 0 0 20px var(--red); 
        }
        .status-light { width: 15px; height: 15px; background: #333; border-radius: 50%; margin: 15px auto; }
        .active-light { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
    </style>
</head>
<body>

<div class="studio-frame">
    <h2 style="color:var(--red);">X-VOICE <span style="color:white">PRO</span></h2>
    <p id="msg" style="font-size:12px; color:#888;">PERMISSION STATUS: WAITING...</p>
    
    <div id="light" class="status-light"></div>
    
    <button id="masterBtn" class="main-btn" onclick="askPermissionFirst()">🎤</button>
    
    <div style="margin-top:20px;">
        <p style="font-size:10px;">ID: XV-2026-OWNER-RANJAN</p>
    </div>
</div>

<script>
    let audioContext;
    let stream;

    // Sabse pehle Permission mangne ka system
    async function askPermissionFirst() {
        const msg = document.getElementById('msg');
        const light = document.getElementById('light');
        const btn = document.getElementById('masterBtn');

        try {
            // Ye line browser ko majboor karegi popup dikhane ke liye
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            if (stream) {
                msg.innerText = "PERMISSION GRANTED! MIC ACTIVE";
                msg.style.color = "#00ff00";
                light.classList.add('active-light');
                btn.style.background = "#00ff00";
                btn.onclick = startLiveStudio; // Permission milte hi function badal jayega
                
                // Sound test
                const synth = window.speechSynthesis;
                synth.speak(new SpeechSynthesisUtterance("Mic access successful. Ready for Ranjan."));
            }
        } catch (err) {
            msg.innerText = "ERROR: CLICK 'ALLOW' ON POPUP!";
            msg.style.color = "red";
            alert("Bhai, screen ke upar 'Allow' ka button aaya hoga, usse click karo!");
        }
    }

    async function startLiveStudio() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        
        // Direct Speaker Connection
        source.connect(audioContext.destination);
        
        document.getElementById('msg').innerText = "LIVE ON SPEAKER!";
        document.getElementById('masterBtn').innerText = "🛑";
        document.getElementById('masterBtn').onclick = () => location.reload();
    }
</script>

</body>
</html>
