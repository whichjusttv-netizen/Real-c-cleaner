<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX BHARAT v51.0</title>
    <style>
        :root { --saffron: #FF9933; --white: #FFFFFF; --green: #138808; --navy: #000080; --bg: #050505; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding-top: 40px; }

        /* BHARAT INTERFACE */
        #main-app { padding: 0 15px; height: 100%; display: flex; flex-direction: column; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 2px solid var(--saffron); padding-bottom: 10px; }
        .status-tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: bold; }
        .active-tag { background: var(--green); color: white; }
        .block-tag { background: red; color: white; }

        .search-box { width: 100%; background: #111; border: 1px solid #333; padding: 12px; border-radius: 12px; color: white; margin-bottom: 15px; outline: none; border-bottom: 3px solid var(--saffron); }

        #app-grid { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 80px; scrollbar-width: none; }
        .app-card { background: #111; border: 1px solid #222; border-radius: 18px; padding: 12px; text-align: center; }
        .btn-get { background: var(--saffron); color: black; border: none; padding: 8px; border-radius: 8px; font-weight: 900; width: 100%; margin-top: 8px; font-size: 11px; }

        .pkg-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 15px; border-top: 2px solid var(--green); display: flex; gap: 8px; }
        .pkg-input { flex: 1; background: #111; border: 1px solid #333; padding: 10px; border-radius: 8px; color: white; }
        .pkg-btn { background: var(--saffron); border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="main-app">
        <div class="top-bar">
            <div>
                <h2 style="font-size:18px;">RTX <span style="color:var(--saffron)">BHARAT</span></h2>
                <span id="loc-status" class="status-tag block-tag">SCANNING LOCATION...</span>
            </div>
            <div style="color:var(--saffron); font-size:14px; font-weight:bold;">💎 <span id="cr-val">1500</span></div>
        </div>

        <input type="text" class="search-box" placeholder="Search 10Cr+ Apps..." id="find" onkeyup="search()" disabled>

        <div id="app-grid"></div>
    </div>

    <div class="pkg-bar">
        <input type="text" id="pkg-in" class="pkg-input" placeholder="Enter PKG Code">
        <button class="pkg-btn" onclick="claim()">CLAIM</button>
    </div>

    <script>
        let credits = 1500;
        let isIndia = false;

        // 🛡️ INTERNET LOCATION SEARCH (Server Connect)
        async function checkLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                // Agar server ko "India" (IN) milta hai
                if (data.country === "IN") {
                    isIndia = true;
                    document.getElementById('loc-status').innerText = "INDIA DETECTED 🇮🇳";
                    document.getElementById('loc-status').className = "status-tag active-tag";
                    document.getElementById('find').disabled = false;
                    document.getElementById('find').placeholder = "Search 10Cr+ Apps (Active)";
                    load(); // Automatic Charge/Load
                } else {
                    document.getElementById('loc-status').innerText = "LOCATION BLOCKED ⛔";
                    alert("RTX SECURITY: This app is only for India.");
                }
            } catch (error) {
                // Background search if main API fails
                document.getElementById('loc-status').innerText = "OFFLINE MODE";
            }
        }

        const apps = ["Free Fire India", "BGMI", "Jio Cinema", "Airtel Xstream", "Paytm", "BHIM", "DigiLocker", "RTX Special"];

        function load() {
            if(!isIndia) return;
            const grid = document.getElementById('app-grid');
            grid.innerHTML = "";
            apps.forEach(name => {
                grid.innerHTML += `<div class="app-card" data-name="${name}">
                    <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${name}" style="width:40px; border-radius:50%;">
                    <div style="font-size:11px; font-weight:bold; margin-top:5px;">${name}</div>
                    <button class="btn-get" onclick="redir('${name}')">GET LINK</button>
                </div>`;
            });
        }

        function search() {
            if(!isIndia) return;
            let q = document.getElementById('find').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            let found = false;
            for(let c of cards) {
                if(c.getAttribute('data-name').toLowerCase().includes(q)) {
                    c.style.display = "block";
                    found = true;
                } else { c.style.display = "none"; }
            }
            // 🌐 10 Cr Apps Internet Fetch
            if(q.length > 2 && !found) {
                document.getElementById('app-grid').innerHTML += `<div class="app-card" data-name="${q}">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${q}" style="width:40px;">
                    <div style="font-size:11px; font-weight:bold; color:var(--saffron);">${q.toUpperCase()}</div>
                    <button class="btn-get" onclick="redir('${q}')">BHARAT FETCH</button>
                </div>`;
            }
        }

        function claim() {
            let val = document.getElementById('pkg-in').value.trim().toUpperCase();
            if(val === 'PKG') {
                credits += 1000;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('pkg-in').value = "";
            }
        }

        function redir(name) {
            if(credits >= 500) {
                alert("WE PROVIDE YOU 100% SECURE LINK. PLEASE OPEN WITHOUT ANY WORRY.");
                credits -= 500;
                document.getElementById('cr-val').innerText = credits;
                window.location.href = `https://www.google.com/search?q=${name}+premium+apk+india+secure`;
            } else { alert("Need 500 Coins!"); }
        }

        // Shuru hote hi location check karega
        window.onload = checkLocation;
    </script>
</body>
</html>
