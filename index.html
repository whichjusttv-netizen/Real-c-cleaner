<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX FINAL FIX v27.1</title>
    <style>
        :root { --neon: #00f2ff; --danger: #ff0055; --bg: #030308; --gold: #ffd700; --nebula: linear-gradient(45deg, #050510, #1a0b2e, #050510); }
        body { background: var(--nebula); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; overflow: hidden; height: 100vh; }
        
        #gate { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .box { background: #0a0a14; padding: 30px; border: 1px solid var(--neon); border-radius: 20px; width: 85%; text-align: center; }

        #app { display: none; height: 100%; }
        
        .search-area { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
        #search-bar { flex: 1; padding: 14px; background: rgba(0,0,0,0.8); border: 1px solid var(--neon); color: var(--neon); border-radius: 12px; outline: none; }
        .mic-btn { background: var(--neon); color: #000; border: none; padding: 12px; border-radius: 12px; cursor: pointer; }

        #leaderboard {
            position: fixed; top: 0; right: -100%; width: 85%; height: 100%;
            background: rgba(5, 5, 15, 0.98); backdrop-filter: blur(20px);
            z-index: 1000; transition: 0.5s; padding: 25px; border-left: 2px solid var(--gold);
        }
        .lb-active #leaderboard { right: 0; }

        #main-list { height: 50vh; overflow-y: auto; scrollbar-width: none; margin-top: 10px; padding-bottom: 120px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid #1a1a2e; margin: 10px 0; padding: 18px; border-radius: 15px; }
        
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 20px; display: flex; gap: 10px; border-top: 1px solid var(--gold); z-index: 500; }
        .code-input { flex: 1; background: #0a0a0f; border: 1px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body id="body-main">

    <div id="gate">
        <div class="box">
            <h2 style="color:var(--neon);">RTX CORE</h2>
            <input type="password" id="pk" placeholder="PASSWORD" style="width:85%; padding:15px; background:#000; border:1px solid #222; color:var(--neon); border-radius:12px; text-align:center;">
            <button onclick="unlock()" style="width:90%; padding:15px; background:var(--neon); color:#000; border:none; margin-top:20px; border-radius:12px; font-weight:bold;">INITIALIZE</button>
        </div>
    </div>

    <div id="leaderboard">
        <h2 style="color:var(--gold); text-align:center;">🏆 TRENDS</h2>
        <div id="lb-content"></div>
        <button onclick="toggleLB()" style="width:100%; margin-top:30px; padding:15px; background:var(--danger); border:none; color:#fff; border-radius:12px;">CLOSE</button>
    </div>

    <div id="app">
        <div style="text-align:right; font-size:10px; color:var(--gold);" onclick="toggleLB()">LEADERBOARD ➔</div>
        
        <div class="search-area">
            <input type="text" id="search-bar" placeholder="Khojo..." onkeyup="filterApps()">
            <button class="mic-btn" onclick="startVoice()">🎤</button>
        </div>

        <div style="text-align:center; background:rgba(0,0,0,0.5); padding:15px; border-radius:15px; border:1px solid var(--gold);">
            <span style="color:var(--gold); font-size:12px;">CREDITS</span><br>
            <span id="coin-txt" style="font-size:35px; font-weight:bold; color:#fff;">0000</span>
        </div>

        <div id="main-list"></div>

        <div class="footer">
            <input type="text" id="secret-inp" class="code-input" placeholder="Type 'pkg' here">
            <button onclick="claimSecret()" style="background:var(--gold); padding:0 25px; border-radius:10px; font-weight:bold; color:#000;">CLAIM</button>
        </div>
    </div>

<script>
    // 💰 CREDITS STORAGE ENGINE
    let sc = parseInt(localStorage.getItem('user_sc')) || 0;
    let database = [];

    function updateUI() {
        // Direct screen update (No Delay)
        const display = document.getElementById('coin-txt');
        if(display) {
            display.innerText = sc.toString().padStart(4, '0');
        }
        localStorage.setItem('user_sc', sc);
    }

    // 🔄 FIXED CLAIM SYSTEM
    function claimSecret() {
        const inputField = document.getElementById('secret-inp');
        const code = inputField.value.trim().toLowerCase();
        
        if(code === "pkg") {
            sc = sc + 1000; // Force addition
            updateUI(); // Immediate screen refresh
            alert("SUCCESS: 1000 Credits Injected!");
            inputField.value = ""; // Clear input
        } else {
            alert("ERROR: Invalid Code!");
        }
    }

    function buildDatabase() {
        const apps = ["Gemini AI", "Netflix 4K", "Minecraft", "GTA VI", "ChatGPT-5", "Spotify Gold"];
        database = [];
        for(let i = 1; i <= 1000; i++) {
            let base = apps[i % apps.length];
            database.push({ n: `${base} Premium #${i}`, s: `https://www.google.com/search?q=${encodeURIComponent(base)}+premium` });
        }
    }

    function render(list) {
        const container = document.getElementById('main-list');
        let html = "";
        let limit = Math.min(list.length, 30);
        for(let i = 0; i < limit; i++) {
            html += `<div class="card">
                <h3 style="color:var(--neon); margin:0;">${list[i].n}</h3>
                <button onclick="openChrome('${list[i].s}')" style="margin-top:10px; background:var(--neon); border:none; width:100%; padding:10px; border-radius:8px; font-weight:bold;">GET SOURCE</button>
            </div>`;
        }
        container.innerHTML = html;
    }

    function startVoice() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Speech) { alert("Voice not supported in this browser"); return; }
        const rec = new Speech();
        rec.lang = 'hi-IN';
        rec.start();
        rec.onresult = (e) => { document.getElementById('search-bar').value = e.results[0][0].transcript; filterApps(); };
    }

    function toggleLB() { document.body.classList.toggle('lb-active'); }

    function unlock() {
        if(document.getElementById('pk').value === "RTX") {
            document.getElementById('gate').style.display='none';
            document.getElementById('app').style.display='block';
            buildDatabase(); render(database); updateUI();
        } else { alert("WRONG PASSWORD"); }
    }

    function filterApps() {
        let q = document.getElementById('search-bar').value.toLowerCase();
        let filtered = database.filter(a => a.n.toLowerCase().includes(q));
        render(filtered);
    }

    function openChrome(url) {
        if(sc >= 500) { sc -= 500; updateUI(); window.open(url, '_blank'); }
        else { alert("Credits Low! Use 'pkg' code."); }
    }

    // Initial Load
    window.onload = updateUI;
</script>
</body>
</html>
