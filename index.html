<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX GHOST VAULT</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000; --gold: #ffd700; }
        body { 
            background: #050505; color: #fff; font-family: sans-serif; 
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* 📱 COMPACT FRAME */
        #app-frame {
            width: 92%; height: 92%; background: var(--bg);
            border: 1px solid #1a1a2e; border-radius: 30px;
            position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        /* 🧮 FAKE CALCULATOR UI */
        #fake-calc {
            display: none; height: 100%; padding: 20px; flex-direction: column;
            background: #111; justify-content: space-between;
        }
        #calc-screen {
            background: #222; height: 100px; border-radius: 10px;
            text-align: right; padding: 20px; font-size: 40px; color: #0f0;
            overflow: hidden; border: 2px solid #333;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { 
            background: #333; border: none; color: #fff; padding: 20px; 
            border-radius: 10px; font-size: 18px; font-weight: bold;
        }

        /* 🚀 ASLI APP UI */
        #real-app { display: none; height: 100%; position: relative; }
        .header { padding: 15px; border-bottom: 1px solid #222; text-align: center; }
        #main-list { height: 60%; overflow-y: auto; padding: 15px; }
        .card { background: #12121c; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid var(--neon); }

        /* 🔑 LOGIN GATE */
        #gate { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-inp { width: 80%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #000; color: var(--neon); text-align: center; font-size: 20px; margin-bottom: 20px; }
        .login-btn { width: 85%; padding: 15px; background: var(--neon); border: none; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div id="app-frame">
    
    <div id="gate">
        <h2 style="color: var(--neon); letter-spacing: 2px;">SYSTEM LOCK</h2>
        <input type="password" id="master-pass" class="login-inp" placeholder="ENTER KEY">
        <button onclick="checkAccess()" class="login-btn">INITIALIZE</button>
    </div>

    <div id="fake-calc">
        <div id="calc-screen">0</div>
        <div class="calc-grid">
            <button class="calc-btn">7</button><button class="calc-btn">8</button><button class="calc-btn">9</button><button class="calc-btn" style="background:orange">/</button>
            <button class="calc-btn">4</button><button class="calc-btn">5</button><button class="calc-btn">6</button><button class="calc-btn" style="background:orange">*</button>
            <button class="calc-btn">1</button><button class="calc-btn">2</button><button class="calc-btn">3</button><button class="calc-btn" style="background:orange">-</button>
            <button class="calc-btn">0</button><button class="calc-btn">C</button><button class="calc-btn" style="background:var(--neon); color:#000">=</button><button class="calc-btn" style="background:orange">+</button>
        </div>
        <p style="text-align: center; color: #444; font-size: 10px;">Secure Calc v1.0</p>
    </div>

    <div id="real-app">
        <div class="header">
            <div style="color: var(--gold); border: 1px solid var(--gold); display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-bottom: 10px;">
                CREDITS: <span id="coin-txt">0000</span>
            </div>
            <h3 style="margin: 0; color: var(--neon);">RTX GHOST PANEL</h3>
        </div>
        <div id="main-list">
            </div>
        <div style="position: absolute; bottom: 0; width: 100%; background: #000; padding: 20px; box-sizing: border-box;">
            <input type="text" id="pkg-inp" placeholder="pkg code" style="width: 60%; padding: 10px; background: #111; border: 1px solid var(--gold); color: var(--gold); border-radius: 10px;">
            <button onclick="claimPkg()" style="background: var(--gold); padding: 10px; border-radius: 10px; font-weight: bold;">CLAIM</button>
        </div>
    </div>

</div>

<script>
    let credits = parseInt(localStorage.getItem('user_sc')) || 0;

    function checkAccess() {
        const pass = document.getElementById('master-pass').value;
        const gate = document.getElementById('gate');
        
        if(pass === "RTX") {
            gate.style.display = "none";
            document.getElementById('real-app').style.display = "block";
            loadRealContent();
            updateUI();
        } else if(pass === "1111") {
            gate.style.display = "none";
            document.getElementById('fake-calc').style.display = "flex";
        } else {
            alert("WRONG PASSWORD!");
        }
    }

    function loadRealContent() {
        const list = document.getElementById('main-list');
        let html = "";
        const apps = ["Netflix", "Minecraft", "Free Fire VIP", "CapCut Pro", "Gemini AI"];
        for(let i=1; i<=100; i++) {
            html += `<div class="card">
                <h4 style="margin:0;">${apps[i % apps.length]} Premium #${i}</h4>
                <button style="margin-top:10px; width:100%; padding:5px; background:var(--neon); border:none; border-radius:5px; font-weight:bold;">DOWNLOAD</button>
            </div>`;
        }
        list.innerHTML = html;
    }

    function claimPkg() {
        const val = document.getElementById('pkg-inp').value.trim().toLowerCase();
        if(val === "pkg") {
            credits += 1000;
            updateUI();
            alert("1000 Credits Added!");
            document.getElementById('pkg-inp').value = "";
        }
    }

    function updateUI() {
        document.getElementById('coin-txt').innerText = credits.toString().padStart(4, '0');
        localStorage.setItem('user_sc', credits);
    }

    // Calc buttons animation (Visual only)
    document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const screen = document.getElementById('calc-screen');
            if(btn.innerText === "C") screen.innerText = "0";
            else if(screen.innerText === "0") screen.innerText = btn.innerText;
            else screen.innerText += btn.innerText;
        });
    });
</script>
</body>
</html>
