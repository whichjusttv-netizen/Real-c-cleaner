<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Store Global | Unstoppable</title>
    <style>
        :root { --main: #00ff88; --dark: #0a0a0a; --glass: rgba(255, 255, 255, 0.1); }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: white; margin: 0; overflow-x: hidden; }
        
        /* Premium UI */
        .hero { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, #111, #0a0a0a); }
        .logo { font-size: 32px; font-weight: 800; letter-spacing: 2px; color: var(--main); text-shadow: 0 0 15px var(--main); }
        
        /* The Search Engine */
        .search-box-pro {
            margin-top: 30px; position: relative; max-width: 700px; margin-left: auto; margin-right: auto;
        }
        #globalSearch {
            width: 100%; padding: 18px 25px; border-radius: 50px; border: 2px solid #333;
            background: var(--glass); color: white; font-size: 18px; backdrop-filter: blur(10px);
            transition: 0.4s; outline: none;
        }
        #globalSearch:focus { border-color: var(--main); box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }

        /* Results Container */
        .results-area { padding: 20px; max-width: 900px; margin: auto; }
        .app-result-card {
            background: #161616; margin-bottom: 15px; padding: 20px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid var(--main); animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .app-info h3 { margin: 0; color: var(--main); font-size: 20px; }
        .app-info p { margin: 5px 0; color: #aaa; font-size: 13px; }

        .dl-btn {
            background: var(--main); color: black; padding: 10px 25px; border-radius: 8px;
            text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s;
        }
        .dl-btn:hover { background: white; transform: scale(1.1); }
        
        .verified-badge { font-size: 10px; background: #333; padding: 2px 8px; border-radius: 4px; margin-left: 10px; }
    </style>
</head>
<body>

<div class="hero">
    <div class="logo">X-STORE GLOBAL</div>
    <p style="color: #666;">The Largest Database of Official & Rare Apps</p>
    
    <div class="search-box-pro">
        <input type="text" id="globalSearch" placeholder="Enter App Name (e.g. Kinemaster Mod, Sigma Game, GB WhatsApp)...">
        <button onclick="startDeepSearch()" style="margin-top: 15px; padding: 10px 30px; border-radius: 50px; background: var(--main); border: none; cursor: pointer; font-weight: bold;">DEEP SEARCH</button>
    </div>
</div>

<div class="results-area" id="displayBoard">
    <div style="text-align: center; color: #444; margin-top: 50px;">
        Search for any app to fetch official links...
    </div>
</div>

<script>
    function startDeepSearch() {
        const query = document.getElementById('globalSearch').value;
        const board = document.getElementById('displayBoard');
        
        if(query.length < 2) return;

        // Search hote hi user ko lagega ki engine kaam kar raha hai
        board.innerHTML = `<p style="text-align:center;">Connecting to Servers... Searching for <b>${query}</b> Official Port...</p>`;

        // Simulation of a massive database fetch
        setTimeout(() => {
            board.innerHTML = `
                <div class="app-result-card">
                    <div class="app-info">
                        <h3>${query} <span class="verified-badge">OFFICIAL VERIFIED</span></h3>
                        <p>Source: Secure Global Mirror 1</p>
                        <p>Status: 100% Safe | Malware Scanned</p>
                    </div>
                    <a href="https://www.google.com/search?q=${query}+official+download+apk" target="_blank" class="dl-btn">GET APP</a>
                </div>
                
                <div class="app-result-card" style="border-left-color: #007bff;">
                    <div class="app-info">
                        <h3>${query} (Mirror 2)</h3>
                        <p>Source: Community Port</p>
                        <p>Status: Tested on Android 13/14</p>
                    </div>
                    <a href="https://www.bing.com/search?q=${query}+direct+apk+download" target="_blank" class="dl-btn" style="background:#007bff; color:white;">MIRROR LINK</a>
                </div>
            `;
        }, 1500);
    }
</script>

</body>
</html>
