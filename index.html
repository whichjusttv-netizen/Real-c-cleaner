<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via Pro Hybrid</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #fff; }

        /* Via Style Blue Loading Bar */
        #progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(to right, #4285f4, #34a853);
            width: 0%; transition: 0.3s; z-index: 1000;
        }

        /* Clean Search Bar */
        .top-nav {
            padding: 12px; display: flex; gap: 8px;
            border-bottom: 1px solid #f1f1f1; background: #fff;
        }

        #urlBox {
            flex: 1; padding: 10px 15px; border-radius: 20px;
            border: 1px solid #dfe1e5; background: #f8f9fa;
            outline: none; font-size: 15px;
        }

        /* Full Screen WebView Area */
        #viewport {
            width: 100%; height: calc(100vh - 65px);
            border: none;
        }
    </style>
</head>
<body>

<div id="progress"></div>

<div class="top-nav">
    <input type="text" id="urlBox" placeholder="Google Search ya Proxy URL..." onkeydown="if(event.key==='Enter') execute()">
</div>

<iframe id="viewport" src="https://www.google.com/search?igu=1"></iframe>

<script>
    function execute() {
        let input = document.getElementById('urlBox').value;
        let frame = document.getElementById('viewport');
        let loader = document.getElementById('progress');

        loader.style.width = "40%";

        // GOOGLE ALGORITHM + PROXY LOGIC
        let finalUrl = "";

        if (input.includes('.') && !input.includes(' ')) {
            // PROXY MODE: Agar direct URL hai toh proxy server use karega
            // Hum yahan 'CORS Proxy' ka algorithm join kar rahe hain
            finalUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(input);
            // Note: Real app mein hum 'CroxyProxy' ya personal server ka link dalte hain
        } else {
            // GOOGLE SEARCH ALGORITHM: Direct Google results fetch
            finalUrl = "https://www.google.com/search?q=" + encodeURIComponent(input) + "&igu=1";
        }

        frame.src = finalUrl;

        frame.onload = function() {
            loader.style.width = "100%";
            setTimeout(() => { loader.style.width = "0%"; }, 400);
        };
    }
</script>

</body>
</html>
