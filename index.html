<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTX PRO v42.0</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000; --gold: #ffcc00; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        @keyframes rgb-slim {
            0% { border-color: #ff0000; }
            50% { border-color: #00ff00; }
            100% { border-color: #0000ff; }
        }

        body { 
            background: var(--bg); color: white; height: 100vh; overflow: hidden; 
            display: flex; flex-direction: column; 
            border: 1.5px solid #ff0000; animation: rgb-slim 2s linear infinite;
            padding-top: 38px; /* Mobile Status Bar Gap */
        }

        #main-app { display: flex; height: 100%; flex-direction: column; padding: 10px; }

        /* HEADER & SEARCH */
        .top-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .credits-tag { border: 1px solid var(--gold); color: var(--gold); padding: 4px 12px; border-radius: 50px; font-weight: bold; font-size: 13px; }
        
        .search-engine { display: flex; gap: 8px; margin-bottom: 12px; }
        .s-input { background: #111; border: 1px solid var(--neon); flex: 1; padding: 10px; border-radius: 10px; color: white; outline: none; }

        /* 📦 GRID */
        #app-grid { 
            flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            padding-bottom: 20px; scrollbar-width: none;
        }
        
        .app-card { 
            background: #0d0d0d; border: 1px solid #222; border-radius: 15px; padding: 12px; 
            text-align: center; transition: 0.2s;
        }
        .app-logo { width: 45px; height: 45px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #333; }

        /* 💰 PKG ENGINE */
        .bottom-ui { border-top: 1px solid var(--gold); padding: 12px 5px; background: #000; }
        .pkg-row { display: flex; gap: 8px; }
        .pkg-f { background: #111; border: 1px solid var(--gold); flex: 1; padding: 12px; border-radius: 10px; color: white; outline: none; }
        .claim-b { background: var(--gold); border: none; padding: 12px 18px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="main-app">
        <div class="top-row">
            <div class="credits-tag">💎 <span id="cr-val">1500</span> CREDITS</div>
            <div style="font-size: 9px; color: var(--neon);">RTX TURBO v42</div>
        </div>

        <div class="search-engine">
            <input type="text" class="s-input" placeholder="Search 1Cr+ Apps..." id="find" onkeyup="search()">
        </div>

        <div id="app-grid"></div>

        <div class="bottom-ui">
            <div class="pkg-row">
                <input type="text" id="pkg-input" class="pkg-f" placeholder="Enter PKG Code">
                <button class="claim-b" onclick="claim()">CLAIM</button>
            </div>
        </div>
    </div>

    <script>
        let credits = 1500;
        const appsData = [
            {n: "Free Fire MAX", img: "ff"},
            {n: "Sigma Battle Royale", img: "sg"},
            {n: "Minecraft 1.21", img: "mc"},
            {n: "GTA V Mobile", img: "gta"},
            {n: "Netflix Premium", img: "nf"},
            {n: "BGMI Mod", img: "bgmi"}
        ];

        function load() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = "";
            for(let i=0; i<40; i++) {
                let app = appsData[i % appsData.length];
                grid.innerHTML += `
                    <div class="app-card" data-name="${app.n}">
                        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${app.img}${i}" class="app-logo">
                        <h4 style="font-size:10px; margin-bottom:8px;">${app.n}</h4>
                        <button onclick="fastRedir('${app.n}')" style="background:var(--neon); border:none; padding:8px; border-radius:8px; font-weight:bold; font-size:10px; width:100%;">GET LINK</button>
                    </div>
                `;
            }
        }

        // 🚀 1-SECOND TURBO REDIRECT
        function fastRedir(name) {
            if(credits >= 500) {
                credits -= 500;
                document.getElementById('cr-val').innerText = credits;
                
                // Direct Targeted URL Construction
                let cleanName = name.replace(/\s+/g, '+');
                let targetURL = `https://www.google.com/search?q=${cleanName}+premium+apk+direct+download&btnI=1`;
                
                // Open immediately
                window.location.href = targetURL;
            } else {
                alert("Need 500 Credits!");
            }
        }

        function claim() {
            let code = document.getElementById('pkg-input').value.trim().toUpperCase();
            if(code === 'PKG') {
                credits += 1000;
                document.getElementById('cr-val').innerText = credits;
                document.getElementById('pkg-input').value = "";
            }
        }

        function search() {
            let q = document.getElementById('find').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            for(let c of cards) {
                let n = c.getAttribute('data-name').toLowerCase();
                c.style.display = n.includes(q) ? "block" : "none";
            }
        }

        window.onload = load;
    </script>
</body>
</html>
