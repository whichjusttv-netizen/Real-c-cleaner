<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Protocol-X Proxy Browser</title>
    <style>
        /* Dark Professional Theme */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; }
        
        #top-bar {
            background: #1f1f1f;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
            border-bottom: 2px solid #333;
        }

        #url-input {
            flex: 1;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #00ff00; /* Hacker Green Color */
            padding: 10px 15px;
            border-radius: 5px;
            outline: none;
            font-family: monospace;
        }

        #url-input:focus { border-color: #00ff00; box-shadow: 0 0 5px #00ff00; }

        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { background: #00ff00; color: #000; }

        /* Asli Content Area */
        #proxy-frame {
            width: 100%;
            height: calc(100vh - 65px);
            border: none;
            background: #fff;
        }

        .status-text { font-size: 12px; color: #888; margin-left: 10px; }
    </style>
</head>
<body>

<div id="top-bar">
    <span style="color: #00ff00; font-weight: bold;">RANJAN-OS</span>
    <input type="text" id="url-input" placeholder="Website ka naam likho (e.g. youtube.com)">
    <button class="btn" onclick="launchProxy()">GO PROXY</button>
    <span class="status-text">Status: System Online</span>
</div>

<!-- Yahan Proxy load hogi -->
<iframe id="proxy-frame" src="about:blank"></iframe>

<script>
    function launchProxy() {
        let targetUrl = document.getElementById('url-input').value.trim();
        if (!targetUrl) return;

        // Agar user ne http nahi dala toh auto-add karo
        if (!targetUrl.startsWith('http')) {
            targetUrl = 'https://' + targetUrl;
        }

        // Proxy Engine Link (Asli Magic)
        // Hum yahan direct proxy gate use kar rahe hain
        const proxyGateway = "https://www.croxyproxy.com/_p/index.php?q=";
        const encodedUrl = btoa(targetUrl); // URL ko encode karna zaroori hai

        document.getElementById('proxy-frame').src = proxyGateway + encodedUrl;
        
        console.log("Proxy Tunnel Created for: " + targetUrl);
    }

    // Enter dabate hi launch ho jaye
    document.getElementById('url-input').addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            launchProxy();
        }
    });
</script>

</body>
</html>
